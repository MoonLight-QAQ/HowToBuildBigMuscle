# 拾澳 PickAus 管理端接口契约
#
# 通用约定见 docs/api/conventions.md，各业务对象的字段见 docs/design/admin-data-dictionary.md。
# 本文件与它们不一致时，先停下来确认，不要自行选择。
#
# ---------------------------------------------------------------------------
# 文件结构与分工
# ---------------------------------------------------------------------------
#
# 本文件由公共部分和三个负责人区块组成：
#
#   公共部分（W-00a）：文件头、tags、鉴权、公共 schemas / parameters / responses
#   A 区块 @RealninX（W-00b）：概览、订单、退款、举报
#   B 区块 @MoonLight-QAQ（W-00c）：城市、商城类目、商品、配送、图片上传
#   C 区块 @celine-hy（W-00d）：登录、闲置类目、闲置
#
# 规则：
#   1. 每人只在自己的区块内添加内容，区块位于 paths 和 components.schemas 中，
#      以「===== X 区块 =====」和「===== X 区块结束 =====」两行注释为界。
#   2. 可以引用公共部分和别人区块中的定义（$ref），但不要修改别人区块的内容。
#      需要修改时，先和对方沟通，由对方修改。
#   3. 需要新增公共定义、或修改公共部分时，先和所有人沟通，单独提 PR。
#   4. 模块自己用的查询参数直接写在接口内，不放进 components.parameters。
#
# ---------------------------------------------------------------------------
# 写法示例（复制后修改）
# ---------------------------------------------------------------------------
#
# 【成功响应】OpenAPI 没有泛型，用 allOf 把 OkResponse 和本接口的 data 合在一起：
#
#   responses:
#     '200':
#       description: 成功
#       content:
#         application/json:
#           schema:
#             allOf:
#               - $ref: '#/components/schemas/OkResponse'
#               - type: object
#                 properties:
#                   data:
#                     $ref: '#/components/schemas/City'
#
# 【分页列表】data 由 PageMeta 和 items 组成，查询参数引用 Page 和 PageSize：
#
#   parameters:
#     - $ref: '#/components/parameters/Page'
#     - $ref: '#/components/parameters/PageSize'
#     - name: status
#       in: query
#       schema:
#         $ref: '#/components/schemas/OrderStatus'
#   responses:
#     '200':
#       description: 成功
#       content:
#         application/json:
#           schema:
#             allOf:
#               - $ref: '#/components/schemas/OkResponse'
#               - type: object
#                 properties:
#                   data:
#                     allOf:
#                       - $ref: '#/components/schemas/PageMeta'
#                       - type: object
#                         required: [items]
#                         properties:
#                           items:
#                             type: array
#                             items:
#                               $ref: '#/components/schemas/OrderListItem'
#
# 【不分页列表】（类目、城市、时段等）data 只有 items，不带分页字段：
#
#                   data:
#                     type: object
#                     required: [items]
#                     properties:
#                       items:
#                         type: array
#                         items:
#                           $ref: '#/components/schemas/City'
#
# 【没有数据返回】（如删除成功）直接引用 OkNoData：
#
#   responses:
#     '200':
#       $ref: '#/components/responses/OkNoData'
#
# 【错误码】每个接口都要写出可能返回的错误。引用公共的错误响应，
# 并在 description 中写明这个接口在该状态码下可能返回哪些 code：
#
#   responses:
#     '400':
#       $ref: '#/components/responses/ValidationFailed'
#     '401':
#       $ref: '#/components/responses/NeedLogin'
#     '404':
#       $ref: '#/components/responses/NotFound'
#     '409':
#       $ref: '#/components/responses/Conflict'
#       description: NAME_DUPLICATED（名称与已有城市重复）
#
# 【所有字段都写进 required】响应中的字段始终出现，没有值时为 null，不能省略。
# 所以响应结构的每个字段都要列进 required，可以为 null 的字段也一样。
# 漏写会让生成的类型变成可选字段（field?: X），前端要多处理 undefined。
#
# 【可以为 null 的字段】OpenAPI 3.1 没有 nullable，按下面两种情况写：
#
#   引用公共类型或其他 schema 时，用 anyOf：
#     completedAt:
#       anyOf:
#         - $ref: '#/components/schemas/DateTime'
#         - type: 'null'
#
#   普通类型直接写成类型数组：
#     slotNameZh:
#       type: [string, 'null']
#       maxLength: 20
#
# 【双语字段】中英文各一个字段，后缀为 Zh 和 En。两个都要写进 required，
# 长度上限各自按字段清单写（英文一般是中文的两倍），新增和编辑时两个都必填：
#
#   City:
#     type: object
#     required: [id, nameZh, nameEn]
#     properties:
#       id:
#         $ref: '#/components/schemas/Id'
#       nameZh:
#         type: string
#         minLength: 1
#         maxLength: 20
#       nameEn:
#         type: string
#         minLength: 1
#         maxLength: 40
#
# 【路径中的 ID】引用 IdPath：
#
#   /cities/{id}:
#     parameters:
#       - $ref: '#/components/parameters/IdPath'
#
# 【不需要登录的接口】（只有登录接口）在接口上写 security: []。
#
# 【operationId】camelCase 的「动词 + 名词」，如 listOrders、getOrder、startOrderDelivery。

openapi: 3.1.0

info:
  title: 拾澳 PickAus 管理端接口
  version: 0.1.0
  description: |
    拾澳管理后台使用的接口。

    - 通用约定：`docs/api/conventions.md`
    - 字段清单：`docs/design/admin-data-dictionary.md`

servers:
  - url: /api/admin
    description: 管理端接口前缀

security:
  - bearerAuth: []

# 所有模块的 tag 在这里统一定义，各区块直接使用，不要新增或修改。
tags:
  # A @RealninX
  - name: dashboard
    description: 概览
  - name: order
    description: 订单
  - name: refund
    description: 退款
  - name: report
    description: 举报
  # B @MoonLight-QAQ
  - name: city
    description: 城市
  - name: mall-category
    description: 商城类目
  - name: product
    description: 商品
  - name: delivery
    description: 配送（费用、时段、区）
  - name: upload
    description: 图片上传
  # C @celine-hy
  - name: auth
    description: 登录
  - name: flea-category
    description: 闲置类目
  - name: listing
    description: 闲置

paths:
  # 以下两行是公共部分，保证 paths 在没有任何接口时也是合法的，不要删除。
  x-blocks:
    description: 接口按负责人分为 A、B、C 三个区块，见文件开头的说明。

  # ===== A 区块 @RealninX：概览、订单、退款、举报 =====

  /summary:
    get:
      operationId: getSummary
      tags:
        - dashboard
      summary: 查看概览
      description: 四项计数由服务端按当前状态现算。仅提供跳转和只读配送摘要，不执行配送或审核，不写死数字。
      responses:
        "200":
          description: 成功，返回服务器确认后的完整投影
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Summary"
              examples:
                current:
                  summary: 四项待办和只读配置
                  value:
                    ok: true
                    data:
                      pendingOrderCount: 1
                      deliveringOrderCount: 0
                      openRefundCount: 1
                      openReportCount: 1
                      cities:
                        - id: "9000000000000000040"
                          nameZh: 演示城市
                          fulfillment: local
                          deliverableDistrictNamesZh:
                            - 演示区域
                      localFeeCents: 600
                      postFeeCents: 1000
                      freeShippingThresholdCents: 10000
        "400":
          $ref: "#/components/responses/ValidationFailed"
          description: VALIDATION_FAILED：ID、分页、状态枚举或请求字段不合法。
        "401":
          $ref: "#/components/responses/NeedLogin"
          description: NEED_LOGIN：管理员 token 缺失、失效或使用了顾客 token。
        "403":
          $ref: "#/components/responses/Forbidden"
          description: FORBIDDEN：已登录但没有此操作权限。
        "500":
          $ref: "#/components/responses/InternalError"
          description: INTERNAL_ERROR：服务端异常，不应被当作无数据或操作成功。
  /orders:
    get:
      operationId: listOrders
      tags:
        - order
      summary: 分页查询订单
      description: 不传 status 表示全部；状态只能取 OrderStatus。按订单快照展示，列表不提供写操作。空列表返回 items=[]、total=0。
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          required: false
          description: 不传表示全部；空字符串或未知状态返回 VALIDATION_FAILED。
          schema:
            $ref: "#/components/schemas/OrderStatus"
      responses:
        "200":
          description: 成功，返回服务器确认后的完整投影
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/OrderPage"
              examples:
                current:
                  summary: 待配送订单
                  value:
                    ok: true
                    data:
                      items:
                        - id: "9000000000000000010"
                          orderNo: MOCK-ORDER-001
                          status: pending
                          fulfillment: local
                          user: &a1
                            id: "9000000000000000001"
                            nickname: 演示用户
                          cityNameZh: 演示城市
                          timezone: Australia/Sydney
                          slotStartAt: 2026-11-02T07:00:00Z
                          slotEndAt: 2026-11-02T09:00:00Z
                          itemsSummary: 示例商品 ×2
                          actualAmountCents: 8400
                          createdAt: 2026-11-01T00:00:00Z
                          version: 0
                      total: 1
                      page: 1
                      pageSize: 20
                empty:
                  summary: 没有匹配订单
                  value:
                    ok: true
                    data:
                      items: []
                      total: 0
                      page: 1
                      pageSize: 20
        "400":
          $ref: "#/components/responses/ValidationFailed"
          description: VALIDATION_FAILED：ID、分页、状态枚举或请求字段不合法。
        "401":
          $ref: "#/components/responses/NeedLogin"
          description: NEED_LOGIN：管理员 token 缺失、失效或使用了顾客 token。
        "403":
          $ref: "#/components/responses/Forbidden"
          description: FORBIDDEN：已登录但没有此操作权限。
        "500":
          $ref: "#/components/responses/InternalError"
          description: INTERNAL_ERROR：服务端异常，不应被当作无数据或操作成功。
  /orders/{id}:
    get:
      operationId: getOrder
      tags:
        - order
      summary: 查看订单详情
      description: 返回下单时商品/金额/地址快照及退款单跳转信息。线下含日期和时段；快递日期/时段为 null。待支付不得代付或标完成。
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: 成功，返回服务器确认后的完整投影
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Order"
              examples:
                current:
                  summary: 线下订单详情
                  value:
                    ok: true
                    data:
                      id: "9000000000000000010"
                      orderNo: MOCK-ORDER-001
                      status: pending
                      fulfillment: local
                      user: *a1
                      cityNameZh: 演示城市
                      timezone: Australia/Sydney
                      slotStartAt: 2026-11-02T07:00:00Z
                      slotEndAt: 2026-11-02T09:00:00Z
                      actualAmountCents: 8400
                      createdAt: 2026-11-01T00:00:00Z
                      version: 0
                      contactName: 演示收货人
                      contactPhoneMasked: MOCK-不可拨打
                      address: &a2
                        formatted: 演示地址，请勿配送
                        street: 示例街道
                        districtNameZh: 演示区域
                        postcode: "2000"
                      deliveryDate: 2026-11-02
                      slotNameZh: 演示时段
                      remark: null
                      items: &a3
                        - id: "9000000000000000011"
                          productId: "9000000000000000012"
                          nameZh: 示例商品
                          nameEn: Example product
                          priceCents: 3900
                          qty: 2
                          refundedQty: 0
                      goodsAmountCents: 7800
                      shippingFeeCents: 600
                      payExpireAt: null
                      paidAt: 2026-11-01T00:01:00Z
                      completedAt: null
                      completedBy: null
                      cancelledAt: null
                      refunds: &a4 []
        "400":
          $ref: "#/components/responses/ValidationFailed"
          description: VALIDATION_FAILED：ID、分页、状态枚举或请求字段不合法。
        "401":
          $ref: "#/components/responses/NeedLogin"
          description: NEED_LOGIN：管理员 token 缺失、失效或使用了顾客 token。
        "403":
          $ref: "#/components/responses/Forbidden"
          description: FORBIDDEN：已登录但没有此操作权限。
        "404":
          $ref: "#/components/responses/NotFound"
          description: NOT_FOUND：目标记录不存在或已逻辑删除。
        "500":
          $ref: "#/components/responses/InternalError"
          description: INTERNAL_ERROR：服务端异常，不应被当作无数据或操作成功。
  /orders/{id}/start-delivery:
    post:
      operationId: startOrderDelivery
      tags:
        - order
      summary: 开始配送或标记已寄出
      description: 仅 pending→delivering；线下称开始配送，快递称标记已寄出。按 id+version+旧状态原子检查并写入，成功后 version 递增，返回最新订单；重复/过期提交拒绝，不静默成功。
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: 成功，返回服务器确认后的完整投影
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Order"
              examples:
                current:
                  summary: 开始配送后
                  value:
                    ok: true
                    data:
                      id: "9000000000000000010"
                      orderNo: MOCK-ORDER-001
                      status: delivering
                      fulfillment: local
                      user: *a1
                      cityNameZh: 演示城市
                      timezone: Australia/Sydney
                      slotStartAt: 2026-11-02T07:00:00Z
                      slotEndAt: 2026-11-02T09:00:00Z
                      actualAmountCents: 8400
                      createdAt: 2026-11-01T00:00:00Z
                      version: 1
                      contactName: 演示收货人
                      contactPhoneMasked: MOCK-不可拨打
                      address: *a2
                      deliveryDate: 2026-11-02
                      slotNameZh: 演示时段
                      remark: null
                      items: *a3
                      goodsAmountCents: 7800
                      shippingFeeCents: 600
                      payExpireAt: null
                      paidAt: 2026-11-01T00:01:00Z
                      completedAt: null
                      completedBy: null
                      cancelledAt: null
                      refunds: *a4
        "400":
          $ref: "#/components/responses/ValidationFailed"
          description: VALIDATION_FAILED：ID、分页、状态枚举或请求字段不合法。
        "401":
          $ref: "#/components/responses/NeedLogin"
          description: NEED_LOGIN：管理员 token 缺失、失效或使用了顾客 token。
        "403":
          $ref: "#/components/responses/Forbidden"
          description: FORBIDDEN：已登录但没有此操作权限。
        "404":
          $ref: "#/components/responses/NotFound"
          description: NOT_FOUND：目标记录不存在或已逻辑删除。
        "409":
          $ref: "#/components/responses/Conflict"
          description: INVALID_STATUS：当前状态不允许或预期旧状态已变化；VERSION_CONFLICT：读取的版本已过期。请重新读取，不盲目重试写入。
        "500":
          $ref: "#/components/responses/InternalError"
          description: INTERNAL_ERROR：服务端异常，不应被当作无数据或操作成功。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartOrderDeliveryInput"
            examples:
              current:
                summary: 提交读取到的版本及预期旧状态
                value:
                  version: 0
                  expectedStatus: pending
  /orders/{id}/arrive:
    post:
      operationId: arriveOrder
      tags:
        - order
      summary: 标记已送达
      description: 允许 pending 或 delivering→done，包括从待配送直接送达。服务端记录
        completedBy=staff、completedAt=当前UTC并递增版本。unpaid/refunding/refunded/cancelled/done
        均不允许。24小时自动完成由服务端任务处理，不提供模拟时钟按钮。
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: 成功，返回服务器确认后的完整投影
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Order"
              examples:
                current:
                  summary: 店员直接标记送达
                  value:
                    ok: true
                    data:
                      id: "9000000000000000010"
                      orderNo: MOCK-ORDER-001
                      status: done
                      fulfillment: local
                      user: *a1
                      cityNameZh: 演示城市
                      timezone: Australia/Sydney
                      slotStartAt: 2026-11-02T07:00:00Z
                      slotEndAt: 2026-11-02T09:00:00Z
                      actualAmountCents: 8400
                      createdAt: 2026-11-01T00:00:00Z
                      version: 1
                      contactName: 演示收货人
                      contactPhoneMasked: MOCK-不可拨打
                      address: *a2
                      deliveryDate: 2026-11-02
                      slotNameZh: 演示时段
                      remark: null
                      items: *a3
                      goodsAmountCents: 7800
                      shippingFeeCents: 600
                      payExpireAt: null
                      paidAt: 2026-11-01T00:01:00Z
                      completedAt: 2026-11-02T09:00:00Z
                      completedBy: staff
                      cancelledAt: null
                      refunds: *a4
        "400":
          $ref: "#/components/responses/ValidationFailed"
          description: VALIDATION_FAILED：ID、分页、状态枚举或请求字段不合法。
        "401":
          $ref: "#/components/responses/NeedLogin"
          description: NEED_LOGIN：管理员 token 缺失、失效或使用了顾客 token。
        "403":
          $ref: "#/components/responses/Forbidden"
          description: FORBIDDEN：已登录但没有此操作权限。
        "404":
          $ref: "#/components/responses/NotFound"
          description: NOT_FOUND：目标记录不存在或已逻辑删除。
        "409":
          $ref: "#/components/responses/Conflict"
          description: INVALID_STATUS：当前状态不允许或预期旧状态已变化；VERSION_CONFLICT：读取的版本已过期。请重新读取，不盲目重试写入。
        "500":
          $ref: "#/components/responses/InternalError"
          description: INTERNAL_ERROR：服务端异常，不应被当作无数据或操作成功。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArriveOrderInput"
            examples:
              current:
                summary: 提交读取到的版本及预期旧状态
                value:
                  version: 0
                  expectedStatus: pending
  /refunds:
    get:
      operationId: listRefunds
      tags:
        - refund
      summary: 分页查询退款单
      description: 按审核状态筛选，不按订单 refunding 状态或渠道进度代替待审。列表仅进入详情，不直接审核。
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          required: false
          description: 不传表示全部；空字符串或未知状态返回 VALIDATION_FAILED。
          schema:
            $ref: "#/components/schemas/RefundStatus"
      responses:
        "200":
          description: 成功，返回服务器确认后的完整投影
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RefundPage"
              examples:
                current:
                  summary: 待审退款单
                  value:
                    ok: true
                    data:
                      items:
                        - &a5
                          id: "9000000000000000020"
                          refundNo: MOCK-REFUND-001
                          orderId: "9000000000000000010"
                          orderNo: MOCK-ORDER-001
                          user: *a1
                          status: open
                          provider: null
                          providerRefundId: null
                          providerRefundStatus: null
                          reason: delivery_issue
                          extra: null
                          items: &a6
                            - orderItemId: "9000000000000000011"
                              nameZh: 示例商品
                              priceCents: 3900
                              qty: 1
                              amountCents: 3900
                          goodsAmountCents: 3900
                          shippingRefundCents: 0
                          totalAmountCents: 3900
                          orderStatusBeforeApply: delivering
                          autoApproved: false
                          reviewedBy: null
                          reviewedAt: null
                          createdAt: 2026-11-01T00:05:00Z
                          version: 0
                      total: 1
                      page: 1
                      pageSize: 20
                empty:
                  summary: 空退款列表
                  value:
                    ok: true
                    data:
                      items: []
                      total: 0
                      page: 1
                      pageSize: 20
        "400":
          $ref: "#/components/responses/ValidationFailed"
