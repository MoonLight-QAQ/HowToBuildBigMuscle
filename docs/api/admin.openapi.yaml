    "title": "拾澳管理端 A + 举报重启契约草案",
    "version": "0.2.0",
    "description": "用户2026-11-01确认范围：订单、退款、概览、举报。金额为AUD整数分、Cents后缀，UTC时间按城市IANA显示。实际支付渠道未确定，provider=mock只代表合成演示。providerRefundStatus参考Stripe Refund五种状态。审核approved与渠道结果独立；只有渠道模拟succeeded更新已退数量。contactPhoneMasked为临时脱敏投影，真实联系方式权限待团队明确。公共定义供W-00a负责人审查，不宣称共享依赖或业务任务已合并。"
  },
