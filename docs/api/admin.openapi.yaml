  # ===== A 区块结束 =====

  # ===== B 区块 @MoonLight-QAQ：城市、商城类目、商品、配送、图片上传 =====

  # ===== B 区块结束 =====

  # ===== C 区块 @celine-hy：登录、闲置类目、闲置 =====

  # ===== C 区块结束 =====

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        登录接口返回的管理员 token，放在请求头中：`Authorization: Bearer <token>`。
        顾客 token 不能调用管理端接口。token 缺失、过期或无效时返回 `NEED_LOGIN`。

  parameters:
    Page:
      name: page
      in: query
      required: false
      description: 页码，从 1 开始
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      description: 每页条数
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdPath:
      name: id
      in: path
      required: true
      description: 资源 ID
      schema:
        $ref: '#/components/schemas/Id'

  responses:
    OkNoData:
      description: 成功，没有数据返回
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/OkResponse'
              - type: object
                properties:
                  data:
                    type: 'null'
          example:
            ok: true
            data: null
    ValidationFailed:
      description: VALIDATION_FAILED（参数校验失败，详情见 details）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            ok: false
            code: VALIDATION_FAILED
            message: 参数校验失败
            details:
              - field: nameZh
                message: 不能为空
    NeedLogin:
      description: NEED_LOGIN（未登录，或 token 失效）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            ok: false
            code: NEED_LOGIN
            message: 登录已失效，请重新登录
    Forbidden:
      description: FORBIDDEN（没有权限）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            ok: false
            code: FORBIDDEN
            message: 没有权限
    NotFound:
      description: NOT_FOUND（资源不存在）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            ok: false
            code: NOT_FOUND
            message: 数据不存在或已被删除
    Conflict:
      description: 业务规则不允许。具体的 code 在各接口中写明
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            ok: false
            code: INVALID_STATUS
            message: 当前状态不允许此操作，请刷新后重试
    InternalError:
      description: INTERNAL_ERROR（服务器内部错误）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            ok: false
            code: INTERNAL_ERROR
            message: 服务器开小差了，请稍后重试

  schemas:
    # ===== 公共部分（W-00a）=====

    # ---------- 基础类型 ----------

    Id:
      type: string
      pattern: '^[0-9]{1,20}$'
      description: 雪花 ID，一律用字符串传输。前端不要转成数字，不要比较大小
      examples:
        - '1854239876543209472'
    Cents:
      type: integer
      minimum: 0
      description: 金额，单位为澳元分。39 元写成 3900。字段名统一以 Cents 结尾
      examples:
        - 3900
    DateTime:
      type: string
      format: date-time
      pattern: 'Z$'
      description: UTC 时间点，ISO 8601 格式，以 Z 结尾。前端按城市时区显示
      examples:
        - '2026-11-01T03:30:00Z'
    LocalDate:
      type: string
      format: date
      description: 城市当地的日期，YYYY-MM-DD
      examples:
        - '2026-11-02'
    ClockTime:
      type: string
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
      description: 钟点，HH:mm，24 小时制
      examples:
        - '08:00'
    Version:
      type: integer
      minimum: 0
      description: 数据版本号。编辑时原样提交，不一致时返回 VERSION_CONFLICT
      examples:
        - 3

    # ---------- 图片 ----------

    ImageKey:
      type: string
      minLength: 1
      description: 图片在 S3 中的对象 key。数据库只保存 key
      examples:
        - prod/product/2026/11/01/abc.jpg
    Image:
      type: object
      description: 接口返回的图片。显示时直接使用 url，不要自己拼接地址
      required: [key, url, width, height]
      properties:
        key:
          $ref: '#/components/schemas/ImageKey'
        url:
          type: string
          format: uri
          description: 经 CloudFront 分发、可直接访问的地址
        width:
          type: integer
          minimum: 1
          description: 宽度（像素）
        height:
          type: integer
          minimum: 1
          description: 高度（像素）
    ImageInput:
      type: object
      description: 提交给业务接口的图片。key 来自上传接口，宽高由前端读取
      required: [key, width, height]
      properties:
        key:
          $ref: '#/components/schemas/ImageKey'
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1

    # ---------- 响应包装 ----------

    OkResponse:
      type: object
      description: 成功响应。各接口用 allOf 指定 data 的结构，见文件开头的示例
      required: [ok, data]
      properties:
        ok:
          const: true
        data:
          description: 对象或数组；没有内容返回时为 null
    ErrorResponse:
      type: object
      description: 失败响应。前端以 code 判断错误类型，message 可以直接提示给用户
      required: [ok, code, message]
      properties:
        ok:
          const: false
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: 中文说明
        details:
          type: array
          description: 参数校验失败时，列出每个出错字段和原因
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: 出错的字段名（camelCase）
        message:
          type: string
          description: 中文原因
    ErrorCode:
      type: string
      description: |
        错误码，与 docs/api/conventions.md 第 9 节一致。
        需要新的错误码时，先加到 conventions.md，再加到这里。
      enum:
        # 通用
        - VALIDATION_FAILED
        - NEED_LOGIN
        - FORBIDDEN
        - NOT_FOUND
        - INVALID_STATUS
        - VERSION_CONFLICT
        - INTERNAL_ERROR
        # 管理端
        - BAD_PASSWORD
        - NAME_DUPLICATED
        - CATEGORY_IN_USE
        - STOCK_BELOW_LOCKED
        - LAST_SLOT
        - LISTING_NOT_ON_SALE
        - REFUND_PAYOUT_FAILED
        - UPLOAD_NOT_ALLOWED

    # ---------- 分页 ----------

    PageMeta:
      type: object
      description: 分页信息。分页列表的 data 由它和 items 组成，见文件开头的示例
      required: [total, page, pageSize]
      properties:
        total:
          type: integer
          minimum: 0
          description: 总条数
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100

    # ---------- 跨模块共用的业务结构 ----------

    UserBrief:
      type: object
      description: 用户简要信息。只有 ID 和昵称，不含手机号等隐私信息
      required: [id, nickname]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        nickname:
          type: string
    Fulfillment:
      type: string
      description: |
        配送方式
        - local：线下配送
        - post：快递
      enum: [local, post]

    # ===== 公共部分结束 =====

    # ===== A 区块 @RealninX：概览、订单、退款、举报 =====

    OrderStatus:
      type: string
      enum:
        - unpaid
        - pending
        - delivering
        - done
        - refunding
        - refunded
        - cancelled
      description: 订单状态。后台仅允许 pending→delivering、pending/delivering→done；其余状态只读。
    RefundStatus:
      type: string
      enum:
        - open
        - approved
        - rejected
      description: 审核状态，与渠道退款进度独立。approved 表示审核同意，不表示已退款或顾客银行已到账。
    ProviderRefundStatus:
      type: string
      enum:
        - pending
        - requires_action
        - succeeded
        - failed
        - canceled
      description: 可替换渠道适配层的退款进度；参考 Stripe Refund 的五个值。当前未选择真实渠道。未发起时为 null；不得用审核同意推导 succeeded。
    ReportStatus:
      type: string
      enum:
        - open
        - ignored
        - handled
      description: 举报处理状态。handled 也包含帖子原已非在售、仅关闭举报的情况。
    ReportListingStatus:
      type: string
      enum:
        - on_sale
        - sold
        - self_removed
        - admin_removed
      description: 举报只读投影中的帖子状态，与闲置模块枚举同义；不定义闲置写接口。
    OrderItem:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Id"
        productId:
          $ref: "#/components/schemas/Id"
        nameZh:
          type: string
          maxLength: 60
        nameEn:
          type: string
          maxLength: 120
        priceCents:
          $ref: "#/components/schemas/Cents"
        qty:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        refundedQty:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: 渠道成功确认并幂等入账的已退件数，0≤refundedQty≤qty；审核同意或处理中不增加。
      required:
        - id
        - productId
        - nameZh
        - nameEn
        - priceCents
        - qty
        - refundedQty
      description: 下单时保存的商品快照，不回查商品现名或现价。
    RefundBrief:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Id"
        refundNo:
          type: string
          maxLength: 64
        status:
          $ref: "#/components/schemas/RefundStatus"
      required:
        - id
        - refundNo
        - status
    AddressSnapshot:
      type: object
      additionalProperties: false
      properties:
        formatted:
          type: string
          maxLength: 300
        street:
          type: string
          maxLength: 150
        districtNameZh:
          anyOf:
            - type: string
              maxLength: 60
            - type: "null"
        postcode:
          type: string
          pattern: ^[0-9]{4}$
          description: 四位邮编，按字符串保留。
      required:
        - formatted
        - street
        - districtNameZh
        - postcode
    OrderListItem:
