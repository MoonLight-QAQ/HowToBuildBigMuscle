        - 中文名和英文名都必填，都不能与已有城市重复，否则返回 NAME_DUPLICATED。
          只在未删除的城市中比较（城市目前不能删除，见字段清单）。
        - fulfillment 不传时默认为 post（快递）。
        - state 必填，**创建后不能修改**：它决定哪些 suburb 能加入这个城市的配送大区。
        - timezone 必填，取 IANA 时区名。前端按州预填，由店员确认；服务器不按州推算时区，
          因为州不能唯一确定时区（见 ADR 0005）。不是有效的 IANA 时区名时返回 VALIDATION_FAILED。
        - 新城市没有配送大区，地址都会越界。线下和快递城市都需要再建配送大区、加入 suburb。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CityCreateInput'
            examples:
              current:
                summary: 新增一个快递城市
                value:
                  nameZh: 布里斯班
                  nameEn: Brisbane
                  fulfillment: post
                  state: QLD
                  timezone: Australia/Brisbane
                  sort: 3
      responses:
        '200':
          description: 成功，返回新建的城市
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/City'
              examples:
                current:
                  summary: 新建的城市
                  value:
                    ok: true
                    data:
                      id: '1854239876543209474'
                      nameZh: 布里斯班
                      nameEn: Brisbane
                      fulfillment: post
                      state: QLD
                      timezone: Australia/Brisbane
                      sort: 3
        '400':
          $ref: '#/components/responses/ValidationFailed'
          description: VALIDATION_FAILED（名称为空或超长、state 缺失或不是有效的州、timezone 不是有效的 IANA 时区名、出现未定义的字段）
        '401':
          $ref: '#/components/responses/NeedLogin'
          description: NEED_LOGIN（未登录，或 token 失效）
        '409':
          $ref: '#/components/responses/Conflict'
          description: NAME_DUPLICATED（中文名或英文名与已有城市重复）
        '500':
          $ref: '#/components/responses/InternalError'
          description: INTERNAL_ERROR（服务器内部错误）

  /cities/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    put:
      tags: [city]
      operationId: updateCity
      summary: 修改城市
      description: |
        修改城市的名称、配送方式、时区和排序。请求中带全部可编辑字段。
        - 请求体**不包含 state**，州创建后不能修改：修改州会让已有的配送大区成员与城市的州不一致。
          请求中出现 state 时返回 VALIDATION_FAILED。确实建错了州，只能新增一个城市。
        - 名称不能与其他城市重复（不和自己比较），否则返回 NAME_DUPLICATED。
        - 修改配送方式不影响已有的订单和闲置帖子，只影响之后的新订单：
          改成线下后，按配送大区和成员的可送设置计算；改成快递后，只要求地址属于本市的大区，按快递邮费和包邮门槛计算。
        - 城市不提供乐观锁（字段清单中城市没有 version），后保存的覆盖先保存的。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CityUpdateInput'
            examples:
              current:
                summary: 把悉尼改成快递
                value:
                  nameZh: 悉尼
                  nameEn: Sydney
                  fulfillment: post
                  timezone: Australia/Sydney
                  sort: 1
      responses:
        '200':
          description: 成功，返回修改后的城市
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/City'
              examples:
                current:
                  summary: 修改后的城市
                  value:
                    ok: true
                    data:
                      id: '1854239876543209472'
                      nameZh: 悉尼
                      nameEn: Sydney
                      fulfillment: post
                      state: NSW
                      timezone: Australia/Sydney
                      sort: 1
        '400':
          $ref: '#/components/responses/ValidationFailed'
          description: VALIDATION_FAILED（名称为空或超长、timezone 不是有效的 IANA 时区名、请求中出现 state 等未定义的字段）
        '401':
          $ref: '#/components/responses/NeedLogin'
          description: NEED_LOGIN（未登录，或 token 失效）
        '404':
          $ref: '#/components/responses/NotFound'
          description: NOT_FOUND（城市不存在）
        '409':
          $ref: '#/components/responses/Conflict'
          description: NAME_DUPLICATED（中文名或英文名与其他城市重复）
        '500':
          $ref: '#/components/responses/InternalError'
          description: INTERNAL_ERROR（服务器内部错误）

  # ---------- suburb 与配送大区 ----------

  /suburbs:
    get:
      tags: [delivery]
      operationId: searchSuburbs
      summary: 搜索 suburb 字典
      description: |
        suburb 字典从澳洲官方数据导入，后台**只读**：不提供新增、修改、删除接口。
        用于往配送大区里添加 suburb 时查找。
        - keyword：全为数字时按邮编**前缀**匹配（如 `20` 匹配 2000～2099）；否则按名称做不区分大小写的包含匹配。不传时不按关键字过滤。
        - state：按州筛选，不传时返回所有州。往大区添加时，前端一般传大区所属城市的州。
        - 按 name、postcode 从小到大排序。
        - 返回结果不表示 suburb 是否已属于某个大区；加入时由 addZoneSuburbs 校验。
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: keyword
          in: query
          required: false
          description: 名称或邮编的关键字。全为数字时按邮编前缀匹配，否则按名称包含匹配
          schema:
            type: string
            minLength: 1
            maxLength: 40
        - name: state
          in: query
          required: false
          description: 按州筛选，不传时返回所有州
          schema:
            $ref: '#/components/schemas/AustralianState'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SuburbPage'
              examples:
                current:
                  summary: 按邮编前缀 20 搜索 NSW
                  value:
                    ok: true
                    data:
                      items:
                        - id: '1854239876543209501'
                          name: Annandale
                          postcode: '2038'
                          state: NSW
                        - id: '1854239876543209500'
                          name: Leichhardt
                          postcode: '2040'
                          state: NSW
                      total: 2
                      page: 1
                      pageSize: 20
                empty:
                  summary: 没有匹配的 suburb
                  value:
                    ok: true
                    data:
                      items: []
                      total: 0
                      page: 1
                      pageSize: 20
        '400':
          $ref: '#/components/responses/ValidationFailed'
          description: VALIDATION_FAILED（分页参数不合法、keyword 为空或超长、state 不是有效的州）
        '401':
          $ref: '#/components/responses/NeedLogin'
          description: NEED_LOGIN（未登录，或 token 失效）
        '500':
          $ref: '#/components/responses/InternalError'
          description: INTERNAL_ERROR（服务器内部错误）

  /delivery-zones:
    get:
      tags: [delivery]
      operationId: listDeliveryZones
      summary: 某个城市的配送大区列表
      description: |
        返回一个城市的全部配送大区。数量很少，不分页，按 sort 从小到大排序。
        - 线下城市和快递城市都有大区：大区圈定城市的服务范围，城市所有大区中的 suburb 就是这个城市的范围。
        - deliverable、localFeeCents 只对线下订单生效；快递城市的大区只用于圈定范围，这两个字段照常返回，但不起作用。
        - 大区不能删除，所以总是返回该城市的全部大区。
      parameters:
        - name: cityId
          in: query
          required: true
          description: 城市 ID
          schema:
            $ref: '#/components/schemas/Id'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/DeliveryZone'
              examples:
                current:
                  summary: 悉尼的两个大区
                  value:
                    ok: true
                    data:
                      items:
                        - id: '1854239876543209480'
                          cityId: '1854239876543209472'
                          nameZh: 内西区
                          nameEn: Inner West
                          deliverable: true
                          localFeeCents: null
                          sort: 1
                          suburbCount: 2
                        - id: '1854239876543209481'
                          cityId: '1854239876543209472'
                          nameZh: 帕拉马塔
                          nameEn: Parramatta
                          deliverable: false
                          localFeeCents: 1000
                          sort: 2
                          suburbCount: 1
        '400':
          $ref: '#/components/responses/ValidationFailed'
          description: VALIDATION_FAILED（cityId 缺失、格式不对，或城市不存在）
        '401':
          $ref: '#/components/responses/NeedLogin'
          description: NEED_LOGIN（未登录，或 token 失效）
        '500':
          $ref: '#/components/responses/InternalError'
          description: INTERNAL_ERROR（服务器内部错误）
    post:
      tags: [delivery]
      operationId: createDeliveryZone
      summary: 新增配送大区
      description: |
        - cityId 必填，**创建后不能修改**：修改会让大区成员与新城市的州不一致。城市不存在时返回 VALIDATION_FAILED。
        - 中文名和英文名在**同一城市内**不能与其他大区重复，否则返回 NAME_DUPLICATED；不同城市可以同名。
        - deliverable 是大区内 suburb 的默认可送设置；localFeeCents 为 null 时使用全店统一配送费，不为 null 时必须 ≥ 0。两者只对线下订单生效。
        - 新大区没有成员，suburbCount 为 0，需要再用 addZoneSuburbs 加入 suburb。
        - 只影响之后的新订单。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryZoneCreateInput'
            examples:
              current:
                summary: 在悉尼新增一个大区
                value:
                  cityId: '1854239876543209472'
                  nameZh: 东区
                  nameEn: Eastern Suburbs
                  deliverable: true
                  localFeeCents: 800
                  sort: 3
      responses:
        '200':
          description: 成功，返回新建的大区
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DeliveryZone'
              examples:
                current:
                  summary: 新建的大区
                  value:
                    ok: true
                    data:
                      id: '1854239876543209482'
                      cityId: '1854239876543209472'
                      nameZh: 东区
                      nameEn: Eastern Suburbs
                      deliverable: true
                      localFeeCents: 800
                      sort: 3
                      suburbCount: 0
        '400':
          $ref: '#/components/responses/ValidationFailed'
          description: VALIDATION_FAILED（名称为空或超长、localFeeCents 为负数或不是整数、cityId 对应的城市不存在、出现未定义的字段）
        '401':
          $ref: '#/components/responses/NeedLogin'
          description: NEED_LOGIN（未登录，或 token 失效）
        '409':
          $ref: '#/components/responses/Conflict'
          description: NAME_DUPLICATED（中文名或英文名与同一城市的其他大区重复）
        '500':
          $ref: '#/components/responses/InternalError'
          description: INTERNAL_ERROR（服务器内部错误）

  /delivery-zones/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    put:
      tags: [delivery]
      operationId: updateDeliveryZone
      summary: 修改配送大区
      description: |
        修改大区的名称、默认可送设置、运费和排序。请求中带全部可编辑字段。
        - 请求体**不包含 cityId**，所属城市创建后不能修改；出现时返回 VALIDATION_FAILED。
        - 名称在同一城市内不能与其他大区重复（不和自己比较），否则返回 NAME_DUPLICATED。
        - 修改 deliverable 只改变**跟随大区**的成员（deliverableOverride 为 null）；单独设置过的成员不变。
        - 只影响之后的新订单，已有订单使用下单时的地址和运费快照。
        - 大区不能删除，不再使用时把其中的 suburb 移出。
        - 配送大区不提供乐观锁（字段清单中没有 version），后保存的覆盖先保存的。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryZoneUpdateInput'
            examples:
              current:
                summary: 帕拉马塔改为可送，使用全店统一配送费
                value:
                  nameZh: 帕拉马塔
                  nameEn: Parramatta
                  deliverable: true
                  localFeeCents: null
                  sort: 2
      responses:
        '200':
          description: 成功，返回修改后的大区
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DeliveryZone'
              examples:
                current:
                  summary: 修改后的大区
                  value:
                    ok: true
                    data:
                      id: '1854239876543209481'
                      cityId: '1854239876543209472'
                      nameZh: 帕拉马塔
                      nameEn: Parramatta
                      deliverable: true
                      localFeeCents: null
                      sort: 2
                      suburbCount: 1
        '400':
          $ref: '#/components/responses/ValidationFailed'
          description: VALIDATION_FAILED（名称为空或超长、localFeeCents 为负数或不是整数、请求中出现 cityId 等未定义的字段）
        '401':
          $ref: '#/components/responses/NeedLogin'
          description: NEED_LOGIN（未登录，或 token 失效）
        '404':
          $ref: '#/components/responses/NotFound'
          description: NOT_FOUND（大区不存在）
        '409':
          $ref: '#/components/responses/Conflict'
          description: NAME_DUPLICATED（中文名或英文名与同一城市的其他大区重复）
        '500':
          $ref: '#/components/responses/InternalError'
          description: INTERNAL_ERROR（服务器内部错误）

  /delivery-zones/{id}/suburbs:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [delivery]
      operationId: listZoneSuburbs
      summary: 配送大区的成员列表
      description: |
        返回大区内的全部 suburb，不分页，按 suburb 的 name、postcode 从小到大排序。
        - deliverable 是**最终**可送：deliverableOverride 不为 null 时取它，否则取大区的 deliverable。
        - localFeeCents 是**实际**的线下配送费：大区的 localFeeCents 不为 null 时取它，否则取全店统一配送费。
        - 两个计算字段只对线下订单生效；快递城市的大区照常返回，但不起作用。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/ZoneSuburb'
              examples:
                current:
                  summary: 内西区的两个成员，其中一个单独设为不可送
                  value:
                    ok: true
                    data:
                      items:
                        - suburb:
                            id: '1854239876543209501'
                            name: Annandale
                            postcode: '2038'
                            state: NSW
                          deliverableOverride: false
                          deliverable: false
                          localFeeCents: 600
                        - suburb:
                            id: '1854239876543209500'
                            name: Leichhardt
                            postcode: '2040'
                            state: NSW
                          deliverableOverride: null
                          deliverable: true
                          localFeeCents: 600
                empty:
                  summary: 大区还没有成员
                  value:
                    ok: true
                    data:
                      items: []
        '401':
          $ref: '#/components/responses/NeedLogin'
          description: NEED_LOGIN（未登录，或 token 失效）
        '404':
          $ref: '#/components/responses/NotFound'
          description: NOT_FOUND（大区不存在）
        '500':
          $ref: '#/components/responses/InternalError'
          description: INTERNAL_ERROR（服务器内部错误）
    post:
      tags: [delivery]
      operationId: addZoneSuburbs
      summary: 往配送大区加入 suburb
      description: |
        一次加入一个或多个 suburb，新成员的 deliverableOverride 为 null（跟随大区）。

        **两条校验：**
        1. 一个 suburb **最多属于一个**配送大区（包括其他城市的大区）。已属于另一个大区时返回 SUBURB_IN_OTHER_ZONE，需要先从原来的大区移出。
        2. suburb 的 state 必须与大区所属城市的 state 一致，否则返回 SUBURB_STATE_MISMATCH。

        **整批处理规则：**
        - 整批**原子**处理：任何一个 suburb 不通过校验，整批都不加入。
        - 出错时 details 列出每个出错的 suburb，field 为 `suburbIds[下标]`，如 `suburbIds[2]`。
          同时有两种业务错误时，code 取 SUBURB_IN_OTHER_ZONE，details 中逐项写明原因。
        - 已经在**本大区**的 suburb 直接跳过，不报错，可以重复提交。
        - suburbIds 中有不存在的 suburb 时返回 VALIDATION_FAILED。
        - 移出大区后，可以重新加入这个或其他大区。

        只影响之后的新订单。成功后用 listZoneSuburbs 和 listDeliveryZones 重新读取成员和 suburbCount。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddZoneSuburbsInput'
            examples:
              current:
                summary: 加入两个 suburb
                value:
                  suburbIds:
                    - '1854239876543209500'
                    - '1854239876543209501'
      responses:
        '200':
          $ref: '#/components/responses/OkNoData'
        '400':
          $ref: '#/components/responses/ValidationFailed'
          description: VALIDATION_FAILED（suburbIds 为空、超过 100 个、有重复，或有不存在的 suburb）
        '401':
          $ref: '#/components/responses/NeedLogin'
          description: NEED_LOGIN（未登录，或 token 失效）
        '404':
          $ref: '#/components/responses/NotFound'
          description: NOT_FOUND（大区不存在）
        '409':
          $ref: '#/components/responses/Conflict'
          description: SUBURB_IN_OTHER_ZONE（有 suburb 已属于另一个配送大区）；SUBURB_STATE_MISMATCH（有 suburb 的州与大区所属城市的州不一致）。details 列出出错的 suburb
        '500':
          $ref: '#/components/responses/InternalError'
          description: INTERNAL_ERROR（服务器内部错误）

  /delivery-zones/{id}/suburbs/{suburbId}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
      - name: suburbId
        in: path
        required: true
        description: suburb 的 ID
        schema:
          $ref: '#/components/schemas/Id'
    put:
      tags: [delivery]
      operationId: updateZoneSuburb
      summary: 单独设置成员是否可送
      description: |
        设置一个成员的 deliverableOverride：true 或 false 表示单独设置，null 表示恢复跟随大区。
        - 只对线下订单生效。
        - suburb 不在这个大区中时返回 NOT_FOUND。
        - 只影响之后的新订单。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateZoneSuburbInput'
            examples:
              current:
                summary: 单独设为不可送
                value:
                  deliverableOverride: false
              follow:
                summary: 恢复跟随大区
                value:
                  deliverableOverride: null
      responses:
        '200':
          description: 成功，返回修改后的成员
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ZoneSuburb'
              examples:
                current:
                  summary: 单独设为不可送后
                  value:
                    ok: true
                    data:
                      suburb:
                        id: '1854239876543209501'
                        name: Annandale
                        postcode: '2038'
                        state: NSW
                      deliverableOverride: false
                      deliverable: false
                      localFeeCents: 600
        '400':
          $ref: '#/components/responses/ValidationFailed'
          description: VALIDATION_FAILED（deliverableOverride 缺失，或不是布尔值或 null）
        '401':
          $ref: '#/components/responses/NeedLogin'
          description: NEED_LOGIN（未登录，或 token 失效）
        '404':
          $ref: '#/components/responses/NotFound'
          description: NOT_FOUND（大区不存在，或 suburb 不在这个大区中）
        '500':
          $ref: '#/components/responses/InternalError'
          description: INTERNAL_ERROR（服务器内部错误）
    delete:
      tags: [delivery]
      operationId: removeZoneSuburb
      summary: 把 suburb 移出配送大区
      description: |
        只删除 suburb 与大区的**关联**（软删除），不影响字典中的 suburb，也不删除大区。
        - 移出后，这个 suburb 不再属于该城市的范围：新地址越界，线下也不可送。已有订单使用下单时的快照，不受影响。
        - 移出后可以重新加入这个或其他大区。
        - suburb 不在这个大区中时返回 NOT_FOUND。
      responses:
        '200':
          $ref: '#/components/responses/OkNoData'
        '401':
          $ref: '#/components/responses/NeedLogin'
          description: NEED_LOGIN（未登录，或 token 失效）
        '404':
          $ref: '#/components/responses/NotFound'
          description: NOT_FOUND（大区不存在，或 suburb 不在这个大区中）
        '500':
          $ref: '#/components/responses/InternalError'
          description: INTERNAL_ERROR（服务器内部错误）

  # ---------- 配送费用与时段 ----------

  /delivery-fees:
    get:
      tags: [delivery]
      operationId: getDeliveryFees
      summary: 查看配送费用
      description: |
        全店一份配置：线下统一配送费、快递邮费、包邮门槛。
        - localFeeCents 在配送大区的 localFeeCents 为 null 时使用，只对线下订单生效。线下订单没有包邮。
        - postFeeCents 和 freeShippingThresholdCents 只对快递订单生效：商品金额达到门槛时邮费为 0。
        - 返回的 version 在修改时原样提交。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DeliveryConfig'
              examples:
                current:
                  summary: 默认配置
                  value:
                    ok: true
                    data:
                      localFeeCents: 600
                      postFeeCents: 800
                      freeShippingThresholdCents: 5000
                      version: 0
        '401':
          $ref: '#/components/responses/NeedLogin'
          description: NEED_LOGIN（未登录，或 token 失效）
        '500':
          $ref: '#/components/responses/InternalError'
          description: INTERNAL_ERROR（服务器内部错误）
    put:
      tags: [delivery]
      operationId: updateDeliveryFees
      summary: 修改配送费用
      description: |
        请求中带全部三个金额和读取到的 version。三个金额都是 ≥ 0 的整数，单位为分。

        **乐观锁：**
        - 提交 getDeliveryFees 返回的 version。服务器按「version 等于当前版本」原子地检查并写入。
        - 版本不一致（其他人在此期间改过）时返回 VERSION_CONFLICT，**不写入任何字段**。前端提示
          「数据已被他人修改，请刷新后重试」，重新读取后再由店员确认，不要自动用旧数据重试。
        - 写入成功后 version 加 1，返回最新的配置。

        只影响之后的新订单，已有订单使用下单时的运费快照。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryConfigInput'
            examples:
              current:
                summary: 包邮门槛改为 1 元
                value:
                  localFeeCents: 600
                  postFeeCents: 800
                  freeShippingThresholdCents: 100
                  version: 0
      responses:
        '200':
          description: 成功，返回修改后的配置
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DeliveryConfig'
              examples:
                current:
                  summary: 修改后，version 加 1
                  value:
                    ok: true
                    data:
                      localFeeCents: 600
                      postFeeCents: 800
                      freeShippingThresholdCents: 100
                      version: 1
        '400':
          $ref: '#/components/responses/ValidationFailed'
          description: VALIDATION_FAILED（金额缺失、为负数或不是整数，version 缺失）
        '401':
          $ref: '#/components/responses/NeedLogin'
          description: NEED_LOGIN（未登录，或 token 失效）
        '409':
          $ref: '#/components/responses/Conflict'
          description: VERSION_CONFLICT（提交的 version 已过期，配置已被他人修改。重新读取，不要盲目重试）
        '500':
          $ref: '#/components/responses/InternalError'
          description: INTERNAL_ERROR（服务器内部错误）

  /delivery-slots:
    get:
      tags: [delivery]
      operationId: listDeliverySlots
      summary: 送达时段列表
      description: |
        时段每天共用，不绑定具体日期。返回全部时段，**包括已停用的**；不分页，按 sort 从小到大排序。
        停用的时段，新的线下订单不能选。快递订单不选时段。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/DeliverySlot'
              examples:
                current:
                  summary: 默认的上午、下午两个时段
                  value:
                    ok: true
                    data:
                      items:
                        - id: '1854239876543209520'
                          nameZh: 上午
                          nameEn: Morning
                          startTime: '08:00'
                          endTime: '12:00'
                          enabled: true
                          sort: 1
                        - id: '1854239876543209521'
                          nameZh: 下午
                          nameEn: Afternoon
                          startTime: '12:00'
                          endTime: '17:00'
                          enabled: true
                          sort: 2
        '401':
          $ref: '#/components/responses/NeedLogin'
          description: NEED_LOGIN（未登录，或 token 失效）
        '500':
          $ref: '#/components/responses/InternalError'
          description: INTERNAL_ERROR（服务器内部错误）
    post:
      tags: [delivery]
      operationId: createDeliverySlot
      summary: 新增送达时段
      description: |
        - 中文名和英文名都必填，都不能与已有时段重复，否则返回 NAME_DUPLICATED。
        - startTime、endTime 为 HH:mm 钟点，endTime 必须晚于 startTime，否则返回 VALIDATION_FAILED。不支持跨午夜的时段。
        - 钟点按城市当地时间理解。订单上的开始和结束时间点，是下单时用所选日期、这个钟点和城市时区算出的 UTC 时间。
        - 只影响之后的新订单。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliverySlotInput'
            examples:
              current:
                summary: 新增一个晚上时段
                value:
                  nameZh: 晚上
                  nameEn: Evening
                  startTime: '18:00'
                  endTime: '20:00'
                  enabled: true
                  sort: 3
      responses:
        '200':
          description: 成功，返回新建的时段
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DeliverySlot'
              examples:
                current:
                  summary: 新建的时段
                  value:
                    ok: true
                    data:
                      id: '1854239876543209522'
                      nameZh: 晚上
                      nameEn: Evening
                      startTime: '18:00'
                      endTime: '20:00'
                      enabled: true
                      sort: 3
        '400':
          $ref: '#/components/responses/ValidationFailed'
          description: VALIDATION_FAILED（名称为空或超长、钟点格式不对、endTime 不晚于 startTime、出现未定义的字段）
        '401':
          $ref: '#/components/responses/NeedLogin'
          description: NEED_LOGIN（未登录，或 token 失效）
        '409':
          $ref: '#/components/responses/Conflict'
          description: NAME_DUPLICATED（中文名或英文名与已有时段重复）
        '500':
          $ref: '#/components/responses/InternalError'
          description: INTERNAL_ERROR（服务器内部错误）

  /delivery-slots/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    put:
      tags: [delivery]
      operationId: updateDeliverySlot
      summary: 修改送达时段
      description: |
        修改名称、钟点、启用状态和排序。请求中带全部可编辑字段。停用和重新启用也通过本接口修改 enabled。
        - 名称不能与其他时段重复（不和自己比较），否则返回 NAME_DUPLICATED。
        - endTime 必须晚于 startTime。
        - 停用后，新的线下订单不能选这个时段；停用最后一个启用中的时段不拦截（字段清单只规定删除时至少保留一个）。
        - 只影响之后的新订单。已有订单的时段名称和开始、结束时间点是下单时的快照，不会改变。
        - 时段不提供乐观锁（字段清单中没有 version），后保存的覆盖先保存的。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliverySlotInput'
            examples:
              current:
                summary: 停用下午时段
                value:
                  nameZh: 下午
                  nameEn: Afternoon
                  startTime: '12:00'
                  endTime: '17:00'
                  enabled: false
                  sort: 2
      responses:
        '200':
          description: 成功，返回修改后的时段
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DeliverySlot'
              examples:
                current:
                  summary: 停用后的时段
                  value:
                    ok: true
                    data:
                      id: '1854239876543209521'
                      nameZh: 下午
                      nameEn: Afternoon
                      startTime: '12:00'
                      endTime: '17:00'
                      enabled: false
                      sort: 2
        '400':
          $ref: '#/components/responses/ValidationFailed'
          description: VALIDATION_FAILED（名称为空或超长、钟点格式不对、endTime 不晚于 startTime、出现未定义的字段）
        '401':
          $ref: '#/components/responses/NeedLogin'
          description: NEED_LOGIN（未登录，或 token 失效）
        '404':
          $ref: '#/components/responses/NotFound'
          description: NOT_FOUND（时段不存在）
        '409':
          $ref: '#/components/responses/Conflict'
          description: NAME_DUPLICATED（中文名或英文名与其他时段重复）
        '500':
          $ref: '#/components/responses/InternalError'
          description: INTERNAL_ERROR（服务器内部错误）
    delete:
      tags: [delivery]
      operationId: deleteDeliverySlot
      summary: 删除送达时段
      description: |
        软删除。已有订单的时段是下单时的快照，不受影响。
        - 至少要保留一个时段（启用或停用的都算）。删除最后一个时返回 LAST_SLOT。
        - 删除后名称可以再次使用。
      responses:
        '200':
          $ref: '#/components/responses/OkNoData'
        '401':
          $ref: '#/components/responses/NeedLogin'
          description: NEED_LOGIN（未登录，或 token 失效）
        '404':
          $ref: '#/components/responses/NotFound'
          description: NOT_FOUND（时段不存在）
        '409':
          $ref: '#/components/responses/Conflict'
          description: LAST_SLOT（这是最后一个时段，至少要保留一个）
        '500':
          $ref: '#/components/responses/InternalError'
          description: INTERNAL_ERROR（服务器内部错误）

  # ---------- 商城类目 ----------

  /mall-categories:
    get:
      tags: [mall-category]
      operationId: listMallCategories
      summary: 商城类目列表
      description: |
        只给商城用，和闲置类目是两个独立的对象和接口。数量很少，不分页，按 sort 从小到大排序。
        不返回已删除的类目。
        inUseCount 是这个类目下**已上架**的商品数（包括缺货的商品），大于 0 时前端禁用删除按钮。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/MallCategory'
              examples:
                current:
                  summary: 两个类目，一个有在售商品
                  value:
                    ok: true
                    data:
                      items:
                        - id: '1854239876543209540'
                          nameZh: 日用百货
                          nameEn: Household
                          sort: 1
                          inUseCount: 12
                        - id: '1854239876543209541'
                          nameZh: 节日礼品
                          nameEn: Festive Gifts
                          sort: 2
                          inUseCount: 0
        '401':
          $ref: '#/components/responses/NeedLogin'
          description: NEED_LOGIN（未登录，或 token 失效）
        '500':
          $ref: '#/components/responses/InternalError'
          description: INTERNAL_ERROR（服务器内部错误）
    post:
      tags: [mall-category]
      operationId: createMallCategory
      summary: 新增商城类目
      description: |
        - 中文名和英文名都必填，都不能与未删除的商城类目重复，否则返回 NAME_DUPLICATED。
          只和商城类目比较，不和闲置类目比较；已删除类目的名称可以再次使用。
        - 类目只能新增和删除，**不能修改**，所以不提供修改接口。
        - 新类目的 inUseCount 为 0。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MallCategoryInput'
            examples:
              current:
                summary: 新增一个类目
                value:
                  nameZh: 节日礼品
                  nameEn: Festive Gifts
                  sort: 2
      responses:
        '200':
          description: 成功，返回新建的类目
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MallCategory'
              examples:
                current:
                  summary: 新建的类目
                  value:
                    ok: true
                    data:
                      id: '1854239876543209541'
                      nameZh: 节日礼品
                      nameEn: Festive Gifts
                      sort: 2
                      inUseCount: 0
        '400':
          $ref: '#/components/responses/ValidationFailed'
          description: VALIDATION_FAILED（名称为空或超长、出现未定义的字段）
        '401':
          $ref: '#/components/responses/NeedLogin'
          description: NEED_LOGIN（未登录，或 token 失效）
        '409':
          $ref: '#/components/responses/Conflict'
          description: NAME_DUPLICATED（中文名或英文名与已有商城类目重复）
        '500':
          $ref: '#/components/responses/InternalError'
          description: INTERNAL_ERROR（服务器内部错误）

  /mall-categories/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    delete:
      tags: [mall-category]
      operationId: deleteMallCategory
      summary: 删除商城类目
      description: |
        软删除。只删除商城类目，不影响闲置类目。
        - 这个类目下还有**已上架**的商品（包括缺货的商品，即 inUseCount 大于 0）时，返回 CATEGORY_IN_USE。
          服务器在删除时重新统计，不以前端看到的 inUseCount 为准。
        - 只有已下架商品的类目可以删除。删除后，这些商品的 categoryNameZh 照常返回原类目名；
          再次编辑这些商品时，需要改选一个未删除的类目，否则返回 VALIDATION_FAILED。
        - 删除后，类目不再出现在列表中，名称可以再次使用。
      responses:
        '200':
          $ref: '#/components/responses/OkNoData'
        '401':
          $ref: '#/components/responses/NeedLogin'
          description: NEED_LOGIN（未登录，或 token 失效）
        '404':
          $ref: '#/components/responses/NotFound'
          description: NOT_FOUND（类目不存在或已删除）
        '409':
          $ref: '#/components/responses/Conflict'
          description: CATEGORY_IN_USE（类目下还有已上架的商品）
        '500':
          $ref: '#/components/responses/InternalError'
          description: INTERNAL_ERROR（服务器内部错误）

  # ===== B 区块结束 =====

  # ===== C 区块 @celine-hy：登录、闲置类目、闲置 =====

  # ---------- 登录 ----------

  /login:
    post:
      tags: [auth]
      operationId: login
      summary: 管理员登录
      description: |
        账号加密码登录，与顾客的微信登录分开。登录成功返回 token 和过期时间。
        登录失败统一返回 BAD_PASSWORD，不区分是账号错还是密码错。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginResult'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          description: BAD_PASSWORD（账号或密码错误）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                ok: false
                code: BAD_PASSWORD
                message: 账号或密码错误
        '500':
          $ref: '#/components/responses/InternalError'

  # ---------- 闲置类目 ----------

  /flea-categories:
    get:
      tags: [flea-category]
      operationId: listFleaCategories
      summary: 闲置类目列表
      description: 只给闲置发布页用，和商城类目分开。数量很少，不分页，按 sort 排序。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/FleaCategory'
        '401':
          $ref: '#/components/responses/NeedLogin'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [flea-category]
      operationId: createFleaCategory
      summary: 新增闲置类目
      description: 中文名和英文名都不能与已有的闲置类目重复。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FleaCategoryInput'
      responses:
        '200':
          description: 成功，返回新建的类目
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/FleaCategory'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/NeedLogin'
        '409':
          $ref: '#/components/responses/Conflict'
          description: NAME_DUPLICATED（中文名或英文名与已有闲置类目重复）
        '500':
          $ref: '#/components/responses/InternalError'

  /flea-categories/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    delete:
      tags: [flea-category]
      operationId: deleteFleaCategory
      summary: 删除闲置类目
      description: 还有在售帖子使用这个类目时不能删除（inUseCount 大于 0）。
      responses:
        '200':
          $ref: '#/components/responses/OkNoData'
        '401':
          $ref: '#/components/responses/NeedLogin'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: CATEGORY_IN_USE（还有在售帖子使用这个类目）
        '500':
          $ref: '#/components/responses/InternalError'

  # ---------- 闲置 ----------

  /listings:
    get:
      tags: [listing]
      operationId: listListings
      summary: 闲置帖子列表（封面墙）
      description: |
        包含在售、已出、卖家自己下架、强制下架的全部帖子，按发布时间从新到旧排列。
        本接口不改变「已浏览」标记，只有打开详情才记为已浏览。
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          required: false
          description: 按状态筛选，不传则返回全部
          schema:
            $ref: '#/components/schemas/ListingStatusFilter'
        - name: city
          in: query
          required: false
          description: 按城市筛选，传城市 ID。不传则返回全部城市
          schema:
            $ref: '#/components/schemas/Id'
        - name: seen
          in: query
          required: false
          description: 传 0 只返回未浏览的帖子，不传则返回全部
          schema:
            type: integer
            enum: [0]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageMeta'
                          - type: object
                            required: [items]
                            properties:
                              items:
                                type: array
                                items:
                                  $ref: '#/components/schemas/ListingListItem'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/NeedLogin'
        '500':
          $ref: '#/components/responses/InternalError'

  /listings/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [listing]
      operationId: getListing
      summary: 查看帖子
      description: |
        返回帖子详情，并把这条帖子的当前内容版本记为已浏览（全店一份，不按管理员分别记录）。
        返回的 seen 是本次打开之后的状态，因此总是 true；
        contentChangedSinceSeen 是本次打开之前的状态，前端据此说明「卖家修改过内容，这次重新记为已浏览」。
        不返回卖家的手机号和微信号。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ListingDetail'
        '401':
          $ref: '#/components/responses/NeedLogin'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /listings/{id}/remove:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [listing]
      operationId: removeListing
      summary: 强制下架帖子
      description: |
        只有在售（on_sale）的帖子可以强制下架，状态变为 admin_removed。
        原因必填，卖家能在自己的帖子里看到。下架不影响「已浏览」标记。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveListingRequest'
      responses:
        '200':
          $ref: '#/components/responses/OkNoData'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/NeedLogin'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: LISTING_NOT_ON_SALE（帖子不是在售状态，不能强制下架）
        '500':
          $ref: '#/components/responses/InternalError'

  # ===== C 区块结束 =====

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        登录接口返回的管理员 token，放在请求头中：`Authorization: Bearer <token>`。
        顾客 token 不能调用管理端接口。token 缺失、过期或无效时返回 `NEED_LOGIN`。

  parameters:
    Page:
      name: page
      in: query
      required: false
      description: 页码，从 1 开始
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      description: 每页条数
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdPath:
      name: id
      in: path
      required: true
      description: 资源 ID
      schema:
        $ref: '#/components/schemas/Id'

  responses:
    OkNoData:
      description: 成功，没有数据返回
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/OkResponse'
              - type: object
                properties:
                  data:
                    type: 'null'
          example:
            ok: true
            data: null
    ValidationFailed:
      description: VALIDATION_FAILED（参数校验失败，详情见 details）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            ok: false
            code: VALIDATION_FAILED
            message: 参数校验失败
            details:
              - field: nameZh
                message: 不能为空
    NeedLogin:
      description: NEED_LOGIN（未登录，或 token 失效）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            ok: false
            code: NEED_LOGIN
            message: 登录已失效，请重新登录
    Forbidden:
      description: FORBIDDEN（没有权限）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            ok: false
            code: FORBIDDEN
            message: 没有权限
    NotFound:
      description: NOT_FOUND（资源不存在）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            ok: false
            code: NOT_FOUND
            message: 数据不存在或已被删除
    Conflict:
      description: 业务规则不允许。具体的 code 在各接口中写明
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            ok: false
            code: INVALID_STATUS
            message: 当前状态不允许此操作，请刷新后重试
    InternalError:
      description: INTERNAL_ERROR（服务器内部错误）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            ok: false
            code: INTERNAL_ERROR
            message: 服务器开小差了，请稍后重试

  schemas:
    # ===== 公共部分（W-00a）=====

    # ---------- 基础类型 ----------

    Id:
      type: string
      pattern: '^[0-9]{1,20}$'
      description: 雪花 ID，一律用字符串传输。前端不要转成数字，不要比较大小
      examples:
        - '1854239876543209472'
    Cents:
      type: integer
      minimum: 0
      description: 金额，单位为澳元分。39 元写成 3900。字段名统一以 Cents 结尾
      examples:
        - 3900
    DateTime:
      type: string
      format: date-time
      pattern: 'Z$'
      description: UTC 时间点，ISO 8601 格式，以 Z 结尾。前端按城市时区显示
      examples:
        - '2026-11-01T03:30:00Z'
    LocalDate:
      type: string
      format: date
      description: 城市当地的日期，YYYY-MM-DD
      examples:
        - '2026-11-02'
    ClockTime:
      type: string
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
      description: 钟点，HH:mm，24 小时制
      examples:
        - '08:00'
    Version:
      type: integer
      minimum: 0
      description: 数据版本号。编辑时原样提交，不一致时返回 VERSION_CONFLICT
      examples:
        - 3

    # ---------- 图片 ----------

    ImageKey:
      type: string
      minLength: 1
      description: 图片在 S3 中的对象 key。数据库只保存 key
      examples:
        - prod/product/2026/11/01/abc.jpg
    Image:
      type: object
      description: 接口返回的图片。显示时直接使用 url，不要自己拼接地址
      required: [key, url, width, height]
      properties:
        key:
          $ref: '#/components/schemas/ImageKey'
        url:
          type: string
          format: uri
          description: 经 CloudFront 分发、可直接访问的地址
        width:
          type: integer
          minimum: 1
          description: 宽度（像素）
        height:
          type: integer
          minimum: 1
          description: 高度（像素）
    ImageInput:
      type: object
      description: 提交给业务接口的图片。key 来自上传接口，宽高由前端读取
      required: [key, width, height]
      properties:
        key:
          $ref: '#/components/schemas/ImageKey'
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1

    # ---------- 响应包装 ----------

    OkResponse:
      type: object
      description: 成功响应。各接口用 allOf 指定 data 的结构，见文件开头的示例
      required: [ok, data]
      properties:
        ok:
          const: true
        data:
          description: 对象或数组；没有内容返回时为 null
    ErrorResponse:
      type: object
      description: 失败响应。前端以 code 判断错误类型，message 可以直接提示给用户
      required: [ok, code, message]
      properties:
        ok:
          const: false
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: 中文说明
        details:
          type: array
          description: 参数校验失败时，列出每个出错字段和原因
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: 出错的字段名（camelCase）
        message:
          type: string
          description: 中文原因
    ErrorCode:
      type: string
      description: |
        错误码，与 docs/api/conventions.md 第 9 节一致。
        需要新的错误码时，先加到 conventions.md，再加到这里。
      enum:
        # 通用
        - VALIDATION_FAILED
        - NEED_LOGIN
        - FORBIDDEN
        - NOT_FOUND
        - INVALID_STATUS
        - VERSION_CONFLICT
        - INTERNAL_ERROR
        # 管理端
        - BAD_PASSWORD
        - NAME_DUPLICATED
        - CATEGORY_IN_USE
        - STOCK_BELOW_LOCKED
        - LAST_SLOT
        - SUBURB_IN_OTHER_ZONE
        - SUBURB_STATE_MISMATCH
        - LISTING_NOT_ON_SALE
        - REFUND_PAYOUT_FAILED
        - UPLOAD_NOT_ALLOWED

    # ---------- 分页 ----------

    PageMeta:
      type: object
      description: 分页信息。分页列表的 data 由它和 items 组成，见文件开头的示例
      required: [total, page, pageSize]
      properties:
        total:
          type: integer
          minimum: 0
          description: 总条数
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100

    # ---------- 跨模块共用的业务结构 ----------

    UserBrief:
      type: object
      description: 用户简要信息。只有 ID 和昵称，不含手机号等隐私信息
      required: [id, nickname]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        nickname:
          type: string
    Fulfillment:
      type: string
      description: |
        配送方式
        - local：线下配送
        - post：快递
      enum: [local, post]

    # ===== 公共部分结束 =====

    # ===== A 区块 @RealninX：概览、订单、退款、举报 =====

    AustralianState:
      type: string
      enum:
        - NSW
        - VIC
        - QLD
        - WA
        - SA
        - TAS
        - ACT
        - NT
      description: |
        澳洲州和领地的标准大写缩写。A、B 区块共用，供订单地址快照、城市及 suburb 字典引用。
        - NSW：新南威尔士州
        - VIC：维多利亚州
        - QLD：昆士兰州
        - WA：西澳大利亚州
        - SA：南澳大利亚州
        - TAS：塔斯马尼亚州
        - ACT：澳大利亚首都领地
        - NT：北领地
    OrderStatus:
      type: string
      enum:
        - unpaid
        - pending
        - delivering
        - done
        - refunding
        - refunded
        - cancelled
      description: 订单状态。后台仅允许 pending→delivering、pending/delivering→done；其余状态只读。
    RefundStatus:
      type: string
      enum:
        - open
        - approved
        - rejected
      description: 审核状态，与渠道退款进度独立。approved 表示审核同意，不表示已退款或顾客银行已到账。
    ProviderRefundStatus:
      type: string
      enum:
        - pending
        - requires_action
        - succeeded
        - failed
        - canceled
      description: 可替换渠道适配层的退款进度；参考 Stripe Refund 的五个值。当前未选择真实渠道。未发起时为 null；不得用审核同意推导 succeeded。
    ReportStatus:
      type: string
      enum:
        - open
        - ignored
        - handled
      description: 举报处理状态。handled 也包含帖子原已非在售、仅关闭举报的情况。
    ReportListingStatus:
      type: string
      enum:
        - on_sale
        - sold
        - self_removed
        - admin_removed
      description: 举报只读投影中的帖子状态，与闲置模块枚举同义；不定义闲置写接口。
    OrderItem:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Id"
        productId:
          $ref: "#/components/schemas/Id"
        nameZh:
          type: string
          maxLength: 60
        nameEn:
          type: string
          maxLength: 120
        priceCents:
          $ref: "#/components/schemas/Cents"
        qty:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        refundedQty:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: 渠道成功确认并幂等入账的已退件数，0≤refundedQty≤qty；审核同意或处理中不增加。
      required:
        - id
        - productId
        - nameZh
        - nameEn
        - priceCents
        - qty
        - refundedQty
      description: 下单时保存的商品快照，不回查商品现名或现价。
    RefundBrief:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Id"
        refundNo:
          type: string
          maxLength: 64
        status:
          $ref: "#/components/schemas/RefundStatus"
      required:
        - id
        - refundNo
        - status
    AddressSnapshot:
      type: object
      additionalProperties: false
      properties:
        formatted:
          type: string
          maxLength: 300
        street:
          type: string
          maxLength: 150
        zoneNameZh:
          anyOf:
            - type: string
              maxLength: 20
            - type: "null"
          description: 下单时配送大区中文名的快照；快递订单允许为 null，不按当前大区名称回算。
        suburb:
          type: string
          maxLength: 40
          description: 下单时 suburb 名称的快照，线下和快递订单均必返。
        postcode:
          type: string
          pattern: ^[0-9]{4}$
          description: 四位邮编，按字符串保留。
        state:
          $ref: "#/components/schemas/AustralianState"
          description: 下单时所属州的快照，线下和快递订单均必返。
      required:
        - formatted
        - street
        - zoneNameZh
        - suburb
        - postcode
        - state
      description: 下单时保存的地址快照；后续大区、成员或 suburb 字典变化不改写本对象。新字段不得根据当前配置反推历史值。
    OrderListItem:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Id"
        orderNo:
          type: string
          maxLength: 64
        status:
          $ref: "#/components/schemas/OrderStatus"
        fulfillment:
          $ref: "#/components/schemas/Fulfillment"
        user:
          $ref: "#/components/schemas/UserBrief"
        cityNameZh:
          type: string
          maxLength: 60
        timezone:
          type: string
          maxLength: 80
          description: 城市 IANA 时区；用于显示时间点，不固定 UTC 偏移，需正确处理夏令时。
        slotStartAt:
          anyOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
          description: 线下配送的时段开始 UTC 时间；快递为 null。
        slotEndAt:
          anyOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
          description: 线下配送的时段结束 UTC 时间；快递为 null。
        itemsSummary:
          type: string
          maxLength: 300
        actualAmountCents:
          $ref: "#/components/schemas/Cents"
          description: 待支付和已取消仅计快照商品金额；其余状态为商品金额加快照运费。部分退款不重写下单快照。
        createdAt:
          $ref: "#/components/schemas/DateTime"
        version:
          $ref: "#/components/schemas/Version"
      required:
        - id
        - orderNo
        - status
        - fulfillment
        - user
        - cityNameZh
        - timezone
        - slotStartAt
        - slotEndAt
        - itemsSummary
        - actualAmountCents
        - createdAt
        - version
      description: 订单列表投影。ID、金额、地址、商品名称和价格按订单快照，不用现价或新配送配置重算。
    Order:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Id"
        orderNo:
          type: string
          maxLength: 64
        status:
          $ref: "#/components/schemas/OrderStatus"
        fulfillment:
          $ref: "#/components/schemas/Fulfillment"
        user:
          $ref: "#/components/schemas/UserBrief"
        cityNameZh:
          type: string
          maxLength: 60
        timezone:
          type: string
          maxLength: 80
        slotStartAt:
          anyOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
        slotEndAt:
          anyOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
        actualAmountCents:
          $ref: "#/components/schemas/Cents"
          description: 待支付/已取消仅商品金额，其他状态为快照商品金额加运费。
        createdAt:
          $ref: "#/components/schemas/DateTime"
        version:
          $ref: "#/components/schemas/Version"
        contactName:
          type: string
          maxLength: 60
        contactPhone:
          type: string
          minLength: 1
          maxLength: 40
          description: 收货人完整联系电话快照。2026-11-02用户确认：仅有配送资料查看权限的管理员可读取；仅用于履约，不返回到列表、用户简表、退款或举报投影。示例使用ACMA预留虚构号码。
        address:
          $ref: "#/components/schemas/AddressSnapshot"
        deliveryDate:
          anyOf:
            - $ref: "#/components/schemas/LocalDate"
            - type: "null"
          description: 城市当地送达日期；快递订单为 null。
        slotNameZh:
          anyOf:
            - type: string
              maxLength: 40
            - type: "null"
        remark:
          anyOf:
            - type: string
              maxLength: 80
            - type: "null"
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        goodsAmountCents:
          $ref: "#/components/schemas/Cents"
        shippingFeeCents:
          $ref: "#/components/schemas/Cents"
          description: 下单时保存的运费快照；待支付和已取消为 0，不用最新配置重算。
        payExpireAt:
          anyOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
        paidAt:
          anyOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
        completedAt:
          anyOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
        completedBy:
          anyOf:
            - type: string
              enum:
                - user
                - staff
                - auto
            - type: "null"
          description: staff 为店员送达；auto 为服务端按线下时段结束满24小时自动完成；user 为用户确认收货。
        cancelledAt:
          anyOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
        refunds:
          type: array
          items:
            $ref: "#/components/schemas/RefundBrief"
          description: 本订单关联退款单的只读跳转信息；审核操作在退款单详情执行。
      required:
        - id
        - orderNo
        - status
        - fulfillment
        - user
        - cityNameZh
        - timezone
        - slotStartAt
        - slotEndAt
        - actualAmountCents
        - createdAt
        - version
        - contactName
        - contactPhone
        - address
        - deliveryDate
        - slotNameZh
        - remark
        - items
        - goodsAmountCents
        - shippingFeeCents
        - payExpireAt
        - paidAt
        - completedAt
        - completedBy
        - cancelledAt
        - refunds
      description: 订单详情快照，仅返回本订单履约所需信息，不返回闲置卖家联系方式。仅具备订单配送资料查看权限的管理员可获取本响应；服务端校验权限，权限不足返回403且不返回订单联系人对象，不以客户端隐藏代替授权。
      examples:
        - id: "9000000000000000010"
          orderNo: MOCK-ORDER-001
          status: pending
          fulfillment: local
          user: &a1
            id: "9000000000000000001"
            nickname: 演示用户
          cityNameZh: 演示城市
          timezone: Australia/Sydney
          slotStartAt: 2026-11-02T07:00:00Z
          slotEndAt: 2026-11-02T09:00:00Z
          actualAmountCents: 8400
          createdAt: 2026-11-01T00:00:00Z
          version: 0
          contactName: 演示收货人
          contactPhone: 0491 570 006
          address:
            formatted: 演示地址，请勿配送
            street: 示例街道
            zoneNameZh: 演示区域
            suburb: Example Suburb
            postcode: "2000"
            state: NSW
          deliveryDate: 2026-11-02
          slotNameZh: 演示时段
          remark: null
          items:
            - id: "9000000000000000011"
              productId: "9000000000000000012"
              nameZh: 示例商品
              nameEn: Example product
              priceCents: 3900
              qty: 2
              refundedQty: 0
          goodsAmountCents: 7800
          shippingFeeCents: 600
          payExpireAt: null
          paidAt: 2026-11-01T00:01:00Z
          completedAt: null
          completedBy: null
          cancelledAt: null
          refunds: []
    RefundItem:
      type: object
      additionalProperties: false
      properties:
        orderItemId:
          $ref: "#/components/schemas/Id"
        nameZh:
          type: string
          maxLength: 60
        priceCents:
          $ref: "#/components/schemas/Cents"
        qty:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        amountCents:
          $ref: "#/components/schemas/Cents"
      required:
        - orderItemId
        - nameZh
        - priceCents
        - qty
        - amountCents
    Refund:
