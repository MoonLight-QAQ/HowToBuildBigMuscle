    StartOrderDeliveryInput:
      type: object
      description: 提交读取到的版本与旧状态；操作者和时间取服务端上下文。
      additionalProperties: false
      required:
        - version
        - expectedStatus
      properties:
        version: &a4
          $ref: "#/components/schemas/Version"
        expectedStatus:
          type: string
          enum:
            - pending
    ArriveOrderInput:
      type: object
      description: 允许待配送直接送达；不接收完成时间或完成人。
      additionalProperties: false
      required:
        - version
        - expectedStatus
      properties:
        version: *a4
        expectedStatus:
          type: string
          enum:
            - pending
            - delivering
    ReviewRefundInput:
      type: object
      description: 只审核待审退款；不接收金额、数量或审核人。
      additionalProperties: false
      required:
        - version
        - expectedStatus
      properties:
        version: *a4
        expectedStatus:
          type: string
          enum:
            - open
    IgnoreReportInput:
      type: object
      description: 只忽略待处理举报，不改变帖子和已有原因。
      additionalProperties: false
      required:
        - version
        - expectedStatus
      properties:
        version: *a4
        expectedStatus:
          type: string
          enum:
            - open
    TakeDownReportInput:
      description: 按读取到的帖子状态分支。在售时原因必填；已非在售仅关闭举报，不提交新原因。服务端检查举报版本及帖子旧状态，任一过期均拒绝，不能以客户端状态绕过检查。
      oneOf:
        - type: object
          description: 下架在售帖子并处理举报。
          additionalProperties: false
          required:
            - version
            - expectedStatus
            - expectedListingStatus
            - reason
          properties:
            version: *a4
            expectedStatus: &a5
              type: string
              enum:
                - open
            expectedListingStatus:
              type: string
              enum:
                - on_sale
            reason:
              type: string
              minLength: 1
              maxLength: 200
              pattern: \S
              description: 1–200字符，不能全为空白；下架后展示给卖家。
        - type: object
          description: 帖子已非在售，只处理举报并保留原下架原因。
          additionalProperties: false
          required:
            - version
            - expectedStatus
            - expectedListingStatus
          properties:
            version: *a4
            expectedStatus: *a5
            expectedListingStatus:
              type: string
              enum:
                - sold
                - self_removed
                - admin_removed

    # ===== A 区块结束 =====

    # ===== B 区块 @MoonLight-QAQ：城市、商城类目、商品、配送、图片上传 =====

    # ---------- 城市 ----------

    City:
      type: object
      description: 城市。商城和闲置共用。城市不能删除
      additionalProperties: false
      required: [id, nameZh, nameEn, fulfillment, state, timezone, sort]
      properties:
        id:
          $ref: '#/components/schemas/Id'
          readOnly: true
        nameZh:
          type: string
          minLength: 1
          maxLength: 20
        nameEn:
          type: string
          minLength: 1
          maxLength: 40
        fulfillment:
          $ref: '#/components/schemas/Fulfillment'
        state:
          $ref: '#/components/schemas/AustralianState'
          description: 所属州。创建后不能修改，用来校验哪些 suburb 能加入这个城市的配送大区
        timezone:
          type: string
          minLength: 1
          description: IANA 时区名，如 Australia/Sydney。前端按它格式化这个城市的时间
        sort:
          type: integer
          description: 排序，越小越靠前
      examples:
        - id: '1854239876543209472'
          nameZh: 悉尼
          nameEn: Sydney
          fulfillment: local
          state: NSW
          timezone: Australia/Sydney
          sort: 1
    CityCreateInput:
      type: object
      description: 新增城市的请求体
      additionalProperties: false
      required: [nameZh, nameEn, state, timezone, sort]
      properties:
        nameZh:
          type: string
          minLength: 1
          maxLength: 20
        nameEn:
          type: string
          minLength: 1
          maxLength: 40
        fulfillment:
          $ref: '#/components/schemas/Fulfillment'
          default: post
          description: 不传时默认为 post（快递）
        state:
          $ref: '#/components/schemas/AustralianState'
          description: 所属州。必填，创建后不能修改
        timezone:
          type: string
          minLength: 1
          description: IANA 时区名。前端按州预填（NSW、ACT 为 Australia/Sydney，VIC 为 Australia/Melbourne 等），由店员确认
        sort:
          type: integer
          description: 排序，越小越靠前
      examples:
        - nameZh: 布里斯班
          nameEn: Brisbane
          fulfillment: post
          state: QLD
          timezone: Australia/Brisbane
          sort: 3
    CityUpdateInput:
      type: object
      description: 修改城市的请求体。不包含 state，州创建后不能修改
      additionalProperties: false
      required: [nameZh, nameEn, fulfillment, timezone, sort]
      properties:
        nameZh:
          type: string
          minLength: 1
          maxLength: 20
        nameEn:
          type: string
          minLength: 1
          maxLength: 40
        fulfillment:
          $ref: '#/components/schemas/Fulfillment'
        timezone:
          type: string
          minLength: 1
          description: IANA 时区名
        sort:
          type: integer
          description: 排序，越小越靠前
      examples:
        - nameZh: 悉尼
          nameEn: Sydney
          fulfillment: post
          timezone: Australia/Sydney
          sort: 1

    # ---------- suburb 与配送大区 ----------

    Suburb:
      type: object
      description: suburb 字典中的一项。从官方数据导入，后台只读。name + postcode + state 唯一；不包含城市
      additionalProperties: false
      required: [id, name, postcode, state]
      properties:
        id:
          $ref: '#/components/schemas/Id'
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 40
          readOnly: true
          description: suburb 名称，如 Leichhardt
        postcode:
          type: string
          pattern: '^[0-9]{4}$'
          readOnly: true
          description: 四位邮编，按字符串保存，保留开头的 0（如 0800）
        state:
          $ref: '#/components/schemas/AustralianState'
          readOnly: true
      examples:
        - id: '1854239876543209500'
          name: Leichhardt
          postcode: '2040'
          state: NSW
    SuburbPage:
      description: suburb 搜索结果的分页
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Suburb'
      examples:
        - items:
            - id: '1854239876543209500'
              name: Leichhardt
              postcode: '2040'
              state: NSW
          total: 1
          page: 1
          pageSize: 20
    DeliveryZone:
      type: object
      description: 配送大区。属于一个城市，圈定城市的服务范围；deliverable 和 localFeeCents 只对线下订单生效。大区不能删除
      additionalProperties: false
      required: [id, cityId, nameZh, nameEn, deliverable, localFeeCents, sort, suburbCount]
      properties:
        id:
          $ref: '#/components/schemas/Id'
          readOnly: true
        cityId:
          $ref: '#/components/schemas/Id'
          description: 所属城市。创建后不能修改
        nameZh:
          type: string
          minLength: 1
          maxLength: 20
          description: 同一城市内不能重复
        nameEn:
          type: string
          minLength: 1
          maxLength: 40
          description: 同一城市内不能重复
        deliverable:
          type: boolean
          description: 大区内 suburb 的默认可送设置。只对线下订单生效
        localFeeCents:
          anyOf:
            - $ref: '#/components/schemas/Cents'
            - type: 'null'
          description: 这个大区的线下配送费。为 null 时使用全店统一配送费。只对线下订单生效
        sort:
          type: integer
          description: 排序，越小越靠前
        suburbCount:
          type: integer
          minimum: 0
          readOnly: true
          description: 大区内的 suburb 数
      examples:
        - id: '1854239876543209480'
          cityId: '1854239876543209472'
          nameZh: 内西区
          nameEn: Inner West
          deliverable: true
          localFeeCents: null
          sort: 1
          suburbCount: 2
    DeliveryZoneCreateInput:
      type: object
      description: 新增配送大区的请求体
      additionalProperties: false
      required: [cityId, nameZh, nameEn, deliverable, localFeeCents, sort]
      properties:
        cityId:
          $ref: '#/components/schemas/Id'
          description: 所属城市。创建后不能修改
        nameZh:
          type: string
          minLength: 1
          maxLength: 20
        nameEn:
          type: string
          minLength: 1
          maxLength: 40
        deliverable:
          type: boolean
          description: 大区内 suburb 的默认可送设置
        localFeeCents:
          anyOf:
            - $ref: '#/components/schemas/Cents'
            - type: 'null'
          description: 这个大区的线下配送费，≥ 0。传 null 表示使用全店统一配送费
        sort:
          type: integer
          description: 排序，越小越靠前
      examples:
        - cityId: '1854239876543209472'
          nameZh: 东区
          nameEn: Eastern Suburbs
          deliverable: true
          localFeeCents: 800
          sort: 3
    DeliveryZoneUpdateInput:
      type: object
      description: 修改配送大区的请求体。不包含 cityId，所属城市创建后不能修改
      additionalProperties: false
      required: [nameZh, nameEn, deliverable, localFeeCents, sort]
      properties:
        nameZh:
          type: string
          minLength: 1
          maxLength: 20
        nameEn:
          type: string
          minLength: 1
          maxLength: 40
        deliverable:
          type: boolean
          description: 大区内 suburb 的默认可送设置
        localFeeCents:
          anyOf:
            - $ref: '#/components/schemas/Cents'
            - type: 'null'
          description: 这个大区的线下配送费，≥ 0。传 null 表示使用全店统一配送费
        sort:
          type: integer
          description: 排序，越小越靠前
      examples:
        - nameZh: 帕拉马塔
          nameEn: Parramatta
          deliverable: true
          localFeeCents: null
          sort: 2
    ZoneSuburb:
      type: object
      description: 配送大区的成员，即 suburb 与大区的关联。移出大区只删除关联，不影响字典
      additionalProperties: false
      required: [suburb, deliverableOverride, deliverable, localFeeCents]
      properties:
        suburb:
          $ref: '#/components/schemas/Suburb'
        deliverableOverride:
          type: [boolean, 'null']
          description: 单独设置是否可送。为 null 时跟随大区
        deliverable:
          type: boolean
          readOnly: true
          description: 最终是否可送 = deliverableOverride 不为 null 时取它，否则取大区的 deliverable。只对线下订单生效
        localFeeCents:
          $ref: '#/components/schemas/Cents'
          readOnly: true
          description: 实际的线下配送费 = 大区的 localFeeCents 不为 null 时取它，否则取全店统一配送费。只对线下订单生效
      examples:
        - suburb:
            id: '1854239876543209500'
            name: Leichhardt
            postcode: '2040'
            state: NSW
          deliverableOverride: null
          deliverable: true
          localFeeCents: 600
    AddZoneSuburbsInput:
      type: object
      description: 往配送大区加入 suburb 的请求体
      additionalProperties: false
      required: [suburbIds]
      properties:
        suburbIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          description: 要加入的 suburb ID，1～100 个，不能重复
          items:
            $ref: '#/components/schemas/Id'
      examples:
        - suburbIds:
            - '1854239876543209500'
            - '1854239876543209501'
    UpdateZoneSuburbInput:
      type: object
      description: 单独设置成员是否可送的请求体
      additionalProperties: false
      required: [deliverableOverride]
      properties:
        deliverableOverride:
          type: [boolean, 'null']
          description: true 或 false 表示单独设置；null 表示恢复跟随大区
      examples:
        - deliverableOverride: false

    # ---------- 配送费用与时段 ----------

    DeliveryConfig:
      type: object
      description: 配送费用，全店一份。修改只影响之后的新订单
      additionalProperties: false
      required: [localFeeCents, postFeeCents, freeShippingThresholdCents, version]
      properties:
        localFeeCents:
          $ref: '#/components/schemas/Cents'
          description: 全店统一线下配送费，默认 600。配送大区的 localFeeCents 为 null 时使用
        postFeeCents:
          $ref: '#/components/schemas/Cents'
          description: 快递邮费，默认 800
        freeShippingThresholdCents:
          $ref: '#/components/schemas/Cents'
          description: 包邮门槛，默认 5000。只对快递订单生效
        version:
          $ref: '#/components/schemas/Version'
          readOnly: true
      examples:
        - localFeeCents: 600
          postFeeCents: 800
          freeShippingThresholdCents: 5000
          version: 0
    DeliveryConfigInput:
      type: object
      description: 修改配送费用的请求体。version 原样提交读取到的值
      additionalProperties: false
      required: [localFeeCents, postFeeCents, freeShippingThresholdCents, version]
      properties:
        localFeeCents:
          $ref: '#/components/schemas/Cents'
          description: 全店统一线下配送费，≥ 0
        postFeeCents:
          $ref: '#/components/schemas/Cents'
          description: 快递邮费，≥ 0
        freeShippingThresholdCents:
          $ref: '#/components/schemas/Cents'
          description: 包邮门槛，≥ 0
        version:
          $ref: '#/components/schemas/Version'
          description: 读取到的版本号，与当前版本不一致时返回 VERSION_CONFLICT
      examples:
        - localFeeCents: 600
          postFeeCents: 800
          freeShippingThresholdCents: 100
          version: 0
    DeliverySlot:
      type: object
      description: 送达时段。每天共用，不绑定具体日期。钟点按城市当地时间理解
      additionalProperties: false
      required: [id, nameZh, nameEn, startTime, endTime, enabled, sort]
      properties:
        id:
          $ref: '#/components/schemas/Id'
          readOnly: true
        nameZh:
          type: string
          minLength: 1
          maxLength: 20
          description: 如「上午」
        nameEn:
          type: string
          minLength: 1
          maxLength: 20
          description: 如 Morning
        startTime:
          $ref: '#/components/schemas/ClockTime'
          description: 开始钟点
        endTime:
          $ref: '#/components/schemas/ClockTime'
          description: 结束钟点，必须晚于开始钟点
        enabled:
          type: boolean
          description: 停用后，新的线下订单不能选
        sort:
          type: integer
          description: 排序，越小越靠前
      examples:
        - id: '1854239876543209520'
          nameZh: 上午
          nameEn: Morning
          startTime: '08:00'
          endTime: '12:00'
          enabled: true
          sort: 1
    DeliverySlotInput:
      type: object
      description: 新增和修改送达时段的请求体
      additionalProperties: false
      required: [nameZh, nameEn, startTime, endTime, enabled, sort]
      properties:
        nameZh:
          type: string
          minLength: 1
          maxLength: 20
        nameEn:
          type: string
          minLength: 1
          maxLength: 20
        startTime:
          $ref: '#/components/schemas/ClockTime'
        endTime:
          $ref: '#/components/schemas/ClockTime'
          description: 必须晚于 startTime
        enabled:
          type: boolean
        sort:
          type: integer
          description: 排序，越小越靠前
      examples:
        - nameZh: 晚上
          nameEn: Evening
          startTime: '18:00'
          endTime: '20:00'
          enabled: true
          sort: 3

    # ---------- 商城类目 ----------

    MallCategory:
      type: object
      description: 商城类目。与闲置类目字段相同，但是独立的对象和接口。只能新增和删除，不能修改
      additionalProperties: false
      required: [id, nameZh, nameEn, sort, inUseCount]
      properties:
        id:
          $ref: '#/components/schemas/Id'
          readOnly: true
        nameZh:
          type: string
          minLength: 1
          maxLength: 20
          description: 不能与其他商城类目重复
        nameEn:
          type: string
          minLength: 1
          maxLength: 40
          description: 不能与其他商城类目重复
        sort:
          type: integer
          description: 排序，越小越靠前
        inUseCount:
          type: integer
          minimum: 0
          readOnly: true
          description: 这个类目下已上架的商品数（包括缺货的）。大于 0 时不能删除，前端据此禁用删除按钮
      examples:
        - id: '1854239876543209540'
          nameZh: 日用百货
          nameEn: Household
          sort: 1
          inUseCount: 12
    MallCategoryInput:
      type: object
      description: 新增商城类目的请求体
      additionalProperties: false
      required: [nameZh, nameEn, sort]
      properties:
        nameZh:
          type: string
          minLength: 1
          maxLength: 20
        nameEn:
          type: string
          minLength: 1
          maxLength: 40
        sort:
          type: integer
          description: 排序，越小越靠前
      examples:
        - nameZh: 节日礼品
          nameEn: Festive Gifts
          sort: 2

    # ===== B 区块结束 =====

    # ===== C 区块 @celine-hy：登录、闲置类目、闲置 =====

    # ---------- 登录 ----------

    Admin:
      type: object
      description: 管理员。第一版只有一两个店员账号，后台不提供管理员的增删改
      required: [id, account]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        account:
          type: string
          maxLength: 32
          description: 登录账号
    LoginRequest:
      type: object
      required: [account, password]
      properties:
        account:
          type: string
          minLength: 1
          maxLength: 32
          description: 登录账号
        password:
          type: string
          minLength: 1
          maxLength: 64
          description: 密码。长度上限为建议值
    LoginResult:
      type: object
      required: [token, expiresAt, admin]
      properties:
        token:
          type: string
          description: '管理员 token，放在请求头中：`Authorization: Bearer <token>`'
        expiresAt:
          $ref: '#/components/schemas/DateTime'
        admin:
          $ref: '#/components/schemas/Admin'

    # ---------- 闲置类目 ----------

    FleaCategory:
      type: object
      description: 闲置类目。与商城类目字段相同，但是独立的对象和接口。只能新增和删除，不能修改
      required: [id, nameZh, nameEn, sort, inUseCount]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        nameZh:
          type: string
          minLength: 1
          maxLength: 20
          description: 中文名，不能重复
        nameEn:
          type: string
          minLength: 1
          maxLength: 40
          description: 英文名，不能重复
        sort:
          type: integer
          description: 排序值，数字小的排在前面
        inUseCount:
          type: integer
          minimum: 0
          description: 使用这个类目的在售帖子数。大于 0 时不能删除，前端据此禁用删除按钮
    FleaCategoryInput:
      type: object
      description: 新增闲置类目时提交的内容
      required: [nameZh, nameEn, sort]
      properties:
        nameZh:
          type: string
          minLength: 1
          maxLength: 20
        nameEn:
          type: string
          minLength: 1
          maxLength: 40
        sort:
          type: integer

    # ---------- 闲置 ----------

    ListingStatus:
      type: string
      description: |
        闲置帖子状态。举报模块（A 区块）也引用本定义
        - on_sale：在售
        - sold：已出（卖家标记）
        - self_removed：已下架（卖家自己下架）
        - admin_removed：已下架（店员强制下架，必须有原因）
      enum: [on_sale, sold, self_removed, admin_removed]
    ListingStatusFilter:
      type: string
      description: |
        闲置列表的状态筛选项
        - on_sale：在售
        - sold：已出
        - removed：已下架，同时包含 self_removed 和 admin_removed
      enum: [on_sale, sold, removed]
    ListingCondition:
      type: string
      description: |
        成色
        - brand_new：全新
        - like_new：几乎全新
        - lightly_used：轻微使用
        - well_used：明显使用
      enum: [brand_new, like_new, lightly_used, well_used]
    ContactRequestStatus:
      type: string
      description: |
        联系方式申请状态。由卖家在小程序中处理，后台只读
        - pending：待处理
        - approved：已同意
        - rejected：已拒绝（只拒绝这一次，对方可以再申请）
        - blocked：已拒绝此人（对方不能再申请这条帖子）
      enum: [pending, approved, rejected, blocked]
    ListingListItem:
      type: object
      description: 闲置列表（封面墙）中的一条帖子。帖子由用户在小程序中发布，后台不能修改内容
      required:
        - id
        - seller
        - cityId
        - cityNameZh
        - categoryId
        - categoryNameZh
        - title
        - priceCents
        - negotiable
        - condition
        - status
        - removeReason
        - cover
        - imageCount
        - seen
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        seller:
          $ref: '#/components/schemas/UserBrief'
        cityId:
          $ref: '#/components/schemas/Id'
        cityNameZh:
          type: string
        categoryId:
          $ref: '#/components/schemas/Id'
        categoryNameZh:
          type: string
        title:
          type: string
          maxLength: 40
        priceCents:
          $ref: '#/components/schemas/Cents'
        negotiable:
          type: boolean
          description: 可小议
        condition:
          $ref: '#/components/schemas/ListingCondition'
        status:
          $ref: '#/components/schemas/ListingStatus'
        removeReason:
          type: [string, 'null']
          maxLength: 200
          description: 强制下架的原因。不是 admin_removed 时为 null
        cover:
          $ref: '#/components/schemas/Image'
        imageCount:
          type: integer
          minimum: 1
          maximum: 9
          description: 图片总数
        seen:
          type: boolean
          description: |
            是否已浏览：当且仅当已浏览的版本号等于当前内容版本号。全店一份，不按管理员分别记录。
            卖家改了标题、描述、图片、标价、是否可小议、成色、类目或城市，内容版本加 1，已浏览去掉。
            评论、回复、联系方式申请和处理、标已出、自己下架、强制下架、举报，都不加版本，标记留着。
        createdAt:
          $ref: '#/components/schemas/DateTime'
    ListingDetail:
      description: 帖子详情。在列表字段的基础上，增加正文、全部图片、评论和联系方式申请
      allOf:
        - $ref: '#/components/schemas/ListingListItem'
        - type: object
          required: [description, images, contentChangedSinceSeen, comments, contactRequests]
          properties:
            description:
              type: string
              maxLength: 300
            images:
              type: array
              minItems: 1
              maxItems: 9
              description: 全部图片，第一张是封面
              items:
                $ref: '#/components/schemas/Image'
            contentChangedSinceSeen:
              type: boolean
              description: 曾被浏览过、但卖家之后修改了内容（本次打开之前的状态）
            comments:
              type: array
              description: 按时间正序
              items:
                $ref: '#/components/schemas/Comment'
            contactRequests:
              type: array
              description: 按时间正序
              items:
                $ref: '#/components/schemas/ContactRequest'
    Comment:
      type: object
      description: 帖子下的评论。回复只有一层
      required: [id, user, parentId, content, deleted, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        user:
          $ref: '#/components/schemas/UserBrief'
        parentId:
          description: 回复的评论。直接评论帖子时为 null
          anyOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        content:
          type: string
          maxLength: 200
          description: deleted 为 true 时为空字符串
        deleted:
          type: boolean
          description: 已被作者删除。页面显示「该评论已删除」
        createdAt:
          $ref: '#/components/schemas/DateTime'
    ContactRequest:
      type: object
      description: |
        联系方式申请（后台视角）。只展示卖家已经做出的处理结果，后台不能替卖家同意或拒绝。
        不包含卖家的手机号和微信号。
      required: [id, buyer, note, status, attemptNo, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        buyer:
          $ref: '#/components/schemas/UserBrief'
        note:
          type: [string, 'null']
          maxLength: 100
          description: 附言
        status:
          $ref: '#/components/schemas/ContactRequestStatus'
        attemptNo:
          type: integer
          minimum: 1
          description: 同一人对这条帖子的第几次申请
        createdAt:
          $ref: '#/components/schemas/DateTime'
    RemoveListingRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '\S'
          description: 强制下架的原因，卖家能看到。去掉首尾空格后不能为空（至少有一个非空白字符）

    # ===== C 区块结束 =====
