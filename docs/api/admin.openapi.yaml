# 拾澳 PickAus 管理端接口契约
#
# 通用约定见 docs/api/conventions.md，各业务对象的字段见 docs/design/admin-data-dictionary.md。
# 本文件与它们不一致时，先停下来确认，不要自行选择。
#
# ---------------------------------------------------------------------------
# 文件结构与分工
# ---------------------------------------------------------------------------
#
# 本文件由公共部分和三个负责人区块组成：
#
#   公共部分（W-00a）：文件头、tags、鉴权、公共 schemas / parameters / responses
#   A 区块 @RealninX（W-00b）：概览、订单、退款、举报
#   B 区块 @MoonLight-QAQ（W-00c）：城市、商城类目、商品、配送、图片上传
#   C 区块 @celine-hy（W-00d）：登录、闲置类目、闲置
#
# 规则：
#   1. 每人只在自己的区块内添加内容，区块位于 paths 和 components.schemas 中，
#      以「===== X 区块 =====」和「===== X 区块结束 =====」两行注释为界。
#   2. 可以引用公共部分和别人区块中的定义（$ref），但不要修改别人区块的内容。
#      需要修改时，先和对方沟通，由对方修改。
#   3. 需要新增公共定义、或修改公共部分时，先和所有人沟通，单独提 PR。
#   4. 模块自己用的查询参数直接写在接口内，不放进 components.parameters。
#
# ---------------------------------------------------------------------------
# 写法示例（复制后修改）
# ---------------------------------------------------------------------------
#
# 【成功响应】OpenAPI 没有泛型，用 allOf 把 OkResponse 和本接口的 data 合在一起：
#
#   responses:
#     '200':
#       description: 成功
#       content:
#         application/json:
#           schema:
#             allOf:
#               - $ref: '#/components/schemas/OkResponse'
#               - type: object
#                 properties:
#                   data:
#                     $ref: '#/components/schemas/City'
#
# 【分页列表】data 由 PageMeta 和 items 组成，查询参数引用 Page 和 PageSize：
#
#   parameters:
#     - $ref: '#/components/parameters/Page'
#     - $ref: '#/components/parameters/PageSize'
#     - name: status
#       in: query
#       schema:
#         $ref: '#/components/schemas/OrderStatus'
#   responses:
#     '200':
#       description: 成功
#       content:
#         application/json:
#           schema:
#             allOf:
#               - $ref: '#/components/schemas/OkResponse'
#               - type: object
#                 properties:
#                   data:
#                     allOf:
#                       - $ref: '#/components/schemas/PageMeta'
#                       - type: object
#                         required: [items]
#                         properties:
#                           items:
#                             type: array
#                             items:
#                               $ref: '#/components/schemas/OrderListItem'
#
# 【不分页列表】（类目、城市、时段等）data 只有 items，不带分页字段：
#
#                   data:
#                     type: object
#                     required: [items]
#                     properties:
#                       items:
#                         type: array
#                         items:
#                           $ref: '#/components/schemas/City'
#
# 【没有数据返回】（如删除成功）直接引用 OkNoData：
#
#   responses:
#     '200':
#       $ref: '#/components/responses/OkNoData'
#
# 【错误码】每个接口都要写出可能返回的错误。引用公共的错误响应，
# 并在 description 中写明这个接口在该状态码下可能返回哪些 code：
#
#   responses:
#     '400':
#       $ref: '#/components/responses/ValidationFailed'
#     '401':
#       $ref: '#/components/responses/NeedLogin'
#     '404':
#       $ref: '#/components/responses/NotFound'
#     '409':
#       $ref: '#/components/responses/Conflict'
#       description: NAME_DUPLICATED（名称与已有城市重复）
#
# 【所有字段都写进 required】响应中的字段始终出现，没有值时为 null，不能省略。
# 所以响应结构的每个字段都要列进 required，可以为 null 的字段也一样。
# 漏写会让生成的类型变成可选字段（field?: X），前端要多处理 undefined。
#
# 【可以为 null 的字段】OpenAPI 3.1 没有 nullable，按下面两种情况写：
#
#   引用公共类型或其他 schema 时，用 anyOf：
#     completedAt:
#       anyOf:
#         - $ref: '#/components/schemas/DateTime'
#         - type: 'null'
#
#   普通类型直接写成类型数组：
#     slotNameZh:
#       type: [string, 'null']
#       maxLength: 20
#
# 【双语字段】中英文各一个字段，后缀为 Zh 和 En。两个都要写进 required，
# 长度上限各自按字段清单写（英文一般是中文的两倍），新增和编辑时两个都必填：
#
#   City:
#     type: object
#     required: [id, nameZh, nameEn]
#     properties:
#       id:
#         $ref: '#/components/schemas/Id'
#       nameZh:
#         type: string
#         minLength: 1
#         maxLength: 20
#       nameEn:
#         type: string
#         minLength: 1
#         maxLength: 40
#
# 【路径中的 ID】引用 IdPath：
#
#   /cities/{id}:
#     parameters:
#       - $ref: '#/components/parameters/IdPath'
#
# 【不需要登录的接口】（只有登录接口）在接口上写 security: []。
#
# 【operationId】camelCase 的「动词 + 名词」，如 listOrders、getOrder、startOrderDelivery。

openapi: 3.1.0

info:
  title: 拾澳 PickAus 管理端接口
  version: 0.1.0
  description: |
    拾澳管理后台使用的接口。

    - 通用约定：`docs/api/conventions.md`
    - 字段清单：`docs/design/admin-data-dictionary.md`

servers:
  - url: /api/admin
    description: 管理端接口前缀

security:
  - bearerAuth: []

# 所有模块的 tag 在这里统一定义，各区块直接使用，不要新增或修改。
tags:
  # A @RealninX
  - name: dashboard
    description: 概览
  - name: order
    description: 订单
  - name: refund
    description: 退款
  - name: report
    description: 举报
  # B @MoonLight-QAQ
  - name: city
    description: 城市
  - name: mall-category
    description: 商城类目
  - name: product
    description: 商品
  - name: delivery
    description: 配送（费用、时段、区）
  - name: upload
    description: 图片上传
  # C @celine-hy
  - name: auth
    description: 登录
  - name: flea-category
    description: 闲置类目
  - name: listing
    description: 闲置

paths:
  # 以下两行是公共部分，保证 paths 在没有任何接口时也是合法的，不要删除。
  x-blocks:
    description: 接口按负责人分为 A、B、C 三个区块，见文件开头的说明。

  # ===== A 区块 @RealninX：概览、订单、退款、举报 =====

  # ===== A 区块结束 =====

  # ===== B 区块 @MoonLight-QAQ：城市、商城类目、商品、配送、图片上传 =====

  # ===== B 区块结束 =====

  # ===== C 区块 @celine-hy：登录、闲置类目、闲置 =====

  # ---------- 登录 ----------

  /login:
    post:
      tags: [auth]
      operationId: login
      summary: 管理员登录
      description: |
        账号加密码登录，与顾客的微信登录分开。登录成功返回 token 和过期时间。
        登录失败统一返回 BAD_PASSWORD，不区分是账号错还是密码错。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginResult'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          description: BAD_PASSWORD（账号或密码错误）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                ok: false
                code: BAD_PASSWORD
                message: 账号或密码错误
        '500':
          $ref: '#/components/responses/InternalError'

  # ---------- 闲置类目 ----------

  /flea-categories:
    get:
      tags: [flea-category]
      operationId: listFleaCategories
      summary: 闲置类目列表
      description: 只给闲置发布页用，和商城类目分开。数量很少，不分页，按 sort 排序。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/FleaCategory'
        '401':
          $ref: '#/components/responses/NeedLogin'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [flea-category]
      operationId: createFleaCategory
      summary: 新增闲置类目
      description: 中文名和英文名都不能与已有的闲置类目重复。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FleaCategoryInput'
      responses:
        '200':
          description: 成功，返回新建的类目
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/FleaCategory'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/NeedLogin'
        '409':
          $ref: '#/components/responses/Conflict'
          description: NAME_DUPLICATED（中文名或英文名与已有闲置类目重复）
        '500':
          $ref: '#/components/responses/InternalError'

  /flea-categories/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    delete:
      tags: [flea-category]
      operationId: deleteFleaCategory
      summary: 删除闲置类目
      description: 还有在售帖子使用这个类目时不能删除（inUseCount 大于 0）。
      responses:
        '200':
          $ref: '#/components/responses/OkNoData'
        '401':
          $ref: '#/components/responses/NeedLogin'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: CATEGORY_IN_USE（还有在售帖子使用这个类目）
        '500':
          $ref: '#/components/responses/InternalError'

  # ---------- 闲置 ----------

  /listings:
    get:
      tags: [listing]
      operationId: listListings
      summary: 闲置帖子列表（封面墙）
      description: |
        包含在售、已出、卖家自己下架、强制下架的全部帖子，按发布时间从新到旧排列。
        本接口不改变「已浏览」标记，只有打开详情才记为已浏览。
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          required: false
          description: 按状态筛选，不传则返回全部
          schema:
            $ref: '#/components/schemas/ListingStatusFilter'
        - name: cityId
          in: query
          required: false
          description: 按城市筛选，不传则返回全部城市
          schema:
            $ref: '#/components/schemas/Id'
        - name: seen
          in: query
          required: false
          description: false 只返回未浏览的帖子，true 只返回已浏览的帖子，不传则返回全部
          schema:
            type: boolean
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageMeta'
                          - type: object
                            required: [items]
                            properties:
                              items:
                                type: array
                                items:
                                  $ref: '#/components/schemas/ListingListItem'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/NeedLogin'
        '500':
          $ref: '#/components/responses/InternalError'

  /listings/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [listing]
      operationId: getListing
      summary: 查看帖子
      description: |
        返回帖子详情，并把这条帖子的当前内容版本记为已浏览（全店一份，不按管理员分别记录）。
        返回的 seen 是本次打开之后的状态，因此总是 true；
        contentChangedSinceSeen 是本次打开之前的状态，前端据此说明「卖家修改过内容，这次重新记为已浏览」。
        不返回卖家的手机号和微信号。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ListingDetail'
        '401':
          $ref: '#/components/responses/NeedLogin'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /listings/{id}/remove:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [listing]
      operationId: removeListing
      summary: 强制下架帖子
      description: |
        只有在售（on_sale）的帖子可以强制下架，状态变为 admin_removed。
        原因必填，卖家能在自己的帖子里看到。下架不影响「已浏览」标记。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveListingRequest'
      responses:
        '200':
          $ref: '#/components/responses/OkNoData'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/NeedLogin'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: LISTING_NOT_ON_SALE（帖子不是在售状态，不能强制下架）
        '500':
          $ref: '#/components/responses/InternalError'

  # ===== C 区块结束 =====

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        登录接口返回的管理员 token，放在请求头中：`Authorization: Bearer <token>`。
        顾客 token 不能调用管理端接口。token 缺失、过期或无效时返回 `NEED_LOGIN`。

  parameters:
    Page:
      name: page
      in: query
      required: false
      description: 页码，从 1 开始
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      description: 每页条数
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdPath:
      name: id
      in: path
      required: true
      description: 资源 ID
      schema:
        $ref: '#/components/schemas/Id'

  responses:
    OkNoData:
      description: 成功，没有数据返回
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/OkResponse'
              - type: object
                properties:
                  data:
                    type: 'null'
          example:
            ok: true
            data: null
    ValidationFailed:
      description: VALIDATION_FAILED（参数校验失败，详情见 details）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            ok: false
            code: VALIDATION_FAILED
            message: 参数校验失败
            details:
              - field: nameZh
                message: 不能为空
    NeedLogin:
      description: NEED_LOGIN（未登录，或 token 失效）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            ok: false
            code: NEED_LOGIN
            message: 登录已失效，请重新登录
    Forbidden:
      description: FORBIDDEN（没有权限）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            ok: false
            code: FORBIDDEN
            message: 没有权限
    NotFound:
      description: NOT_FOUND（资源不存在）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            ok: false
            code: NOT_FOUND
            message: 数据不存在或已被删除
    Conflict:
      description: 业务规则不允许。具体的 code 在各接口中写明
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            ok: false
            code: INVALID_STATUS
            message: 当前状态不允许此操作，请刷新后重试
    InternalError:
      description: INTERNAL_ERROR（服务器内部错误）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            ok: false
            code: INTERNAL_ERROR
            message: 服务器开小差了，请稍后重试

  schemas:
    # ===== 公共部分（W-00a）=====

    # ---------- 基础类型 ----------

    Id:
      type: string
      pattern: '^[0-9]{1,20}$'
      description: 雪花 ID，一律用字符串传输。前端不要转成数字，不要比较大小
      examples:
        - '1854239876543209472'
    Cents:
      type: integer
      minimum: 0
      description: 金额，单位为澳元分。39 元写成 3900。字段名统一以 Cents 结尾
      examples:
        - 3900
    DateTime:
      type: string
      format: date-time
      pattern: 'Z$'
      description: UTC 时间点，ISO 8601 格式，以 Z 结尾。前端按城市时区显示
      examples:
        - '2026-11-01T03:30:00Z'
    LocalDate:
      type: string
      format: date
      description: 城市当地的日期，YYYY-MM-DD
      examples:
        - '2026-11-02'
    ClockTime:
      type: string
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
      description: 钟点，HH:mm，24 小时制
      examples:
        - '08:00'
    Version:
      type: integer
      minimum: 0
      description: 数据版本号。编辑时原样提交，不一致时返回 VERSION_CONFLICT
      examples:
        - 3

    # ---------- 图片 ----------

    ImageKey:
      type: string
      minLength: 1
      description: 图片在 S3 中的对象 key。数据库只保存 key
      examples:
        - prod/product/2026/11/01/abc.jpg
    Image:
      type: object
      description: 接口返回的图片。显示时直接使用 url，不要自己拼接地址
      required: [key, url, width, height]
      properties:
        key:
          $ref: '#/components/schemas/ImageKey'
        url:
          type: string
          format: uri
          description: 经 CloudFront 分发、可直接访问的地址
        width:
          type: integer
          minimum: 1
          description: 宽度（像素）
        height:
          type: integer
          minimum: 1
          description: 高度（像素）
    ImageInput:
      type: object
      description: 提交给业务接口的图片。key 来自上传接口，宽高由前端读取
      required: [key, width, height]
      properties:
        key:
          $ref: '#/components/schemas/ImageKey'
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1

    # ---------- 响应包装 ----------

    OkResponse:
      type: object
      description: 成功响应。各接口用 allOf 指定 data 的结构，见文件开头的示例
      required: [ok, data]
      properties:
        ok:
          const: true
        data:
          description: 对象或数组；没有内容返回时为 null
    ErrorResponse:
      type: object
      description: 失败响应。前端以 code 判断错误类型，message 可以直接提示给用户
      required: [ok, code, message]
      properties:
        ok:
          const: false
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: 中文说明
        details:
          type: array
          description: 参数校验失败时，列出每个出错字段和原因
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: 出错的字段名（camelCase）
        message:
          type: string
          description: 中文原因
    ErrorCode:
      type: string
      description: |
        错误码，与 docs/api/conventions.md 第 9 节一致。
        需要新的错误码时，先加到 conventions.md，再加到这里。
      enum:
        # 通用
        - VALIDATION_FAILED
        - NEED_LOGIN
        - FORBIDDEN
        - NOT_FOUND
        - INVALID_STATUS
        - VERSION_CONFLICT
        - INTERNAL_ERROR
        # 管理端
        - BAD_PASSWORD
        - NAME_DUPLICATED
        - CATEGORY_IN_USE
        - STOCK_BELOW_LOCKED
        - LAST_SLOT
        - LISTING_NOT_ON_SALE
        - REFUND_PAYOUT_FAILED
        - UPLOAD_NOT_ALLOWED

    # ---------- 分页 ----------

    PageMeta:
      type: object
      description: 分页信息。分页列表的 data 由它和 items 组成，见文件开头的示例
      required: [total, page, pageSize]
      properties:
        total:
          type: integer
          minimum: 0
          description: 总条数
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100

    # ---------- 跨模块共用的业务结构 ----------

    UserBrief:
      type: object
      description: 用户简要信息。只有 ID 和昵称，不含手机号等隐私信息
      required: [id, nickname]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        nickname:
          type: string
    Fulfillment:
      type: string
      description: |
        配送方式
        - local：线下配送
        - post：快递
      enum: [local, post]

    # ===== 公共部分结束 =====

    # ===== A 区块 @RealninX：概览、订单、退款、举报 =====

    # ===== A 区块结束 =====

    # ===== B 区块 @MoonLight-QAQ：城市、商城类目、商品、配送、图片上传 =====

    # ===== B 区块结束 =====

    # ===== C 区块 @celine-hy：登录、闲置类目、闲置 =====

    # ---------- 登录 ----------

    Admin:
      type: object
      description: 管理员。第一版只有一两个店员账号，后台不提供管理员的增删改
      required: [id, account]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        account:
          type: string
          maxLength: 32
          description: 登录账号
    LoginRequest:
      type: object
      required: [account, password]
      properties:
        account:
          type: string
          minLength: 1
          maxLength: 32
          description: 登录账号
        password:
          type: string
          minLength: 1
          maxLength: 64
          description: 密码。长度上限为建议值
    LoginResult:
      type: object
      required: [token, expiresAt, admin]
      properties:
        token:
          type: string
          description: '管理员 token，放在请求头中：`Authorization: Bearer <token>`'
        expiresAt:
          $ref: '#/components/schemas/DateTime'
        admin:
          $ref: '#/components/schemas/Admin'

    # ---------- 闲置类目 ----------

    FleaCategory:
      type: object
      description: 闲置类目。与商城类目字段相同，但是独立的对象和接口。只能新增和删除，不能修改
      required: [id, nameZh, nameEn, sort, inUseCount]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        nameZh:
          type: string
          minLength: 1
          maxLength: 20
          description: 中文名，不能重复
        nameEn:
          type: string
          minLength: 1
          maxLength: 40
          description: 英文名，不能重复
        sort:
          type: integer
          description: 排序值，数字小的排在前面
        inUseCount:
          type: integer
          minimum: 0
          description: 使用这个类目的在售帖子数。大于 0 时不能删除，前端据此禁用删除按钮
    FleaCategoryInput:
      type: object
      description: 新增闲置类目时提交的内容
      required: [nameZh, nameEn, sort]
      properties:
        nameZh:
          type: string
          minLength: 1
          maxLength: 20
        nameEn:
          type: string
          minLength: 1
          maxLength: 40
        sort:
          type: integer

    # ---------- 闲置 ----------

    ListingStatus:
      type: string
      description: |
        闲置帖子状态。举报模块（A 区块）也引用本定义
        - on_sale：在售
        - sold：已出（卖家标记）
        - self_removed：已下架（卖家自己下架）
        - admin_removed：已下架（店员强制下架，必须有原因）
      enum: [on_sale, sold, self_removed, admin_removed]
    ListingStatusFilter:
      type: string
      description: |
        闲置列表的状态筛选项
        - on_sale：在售
        - sold：已出
        - removed：已下架，同时包含 self_removed 和 admin_removed
      enum: [on_sale, sold, removed]
    ListingCondition:
      type: string
      description: |
        成色
        - brand_new：全新
        - like_new：几乎全新
        - lightly_used：轻微使用
        - well_used：明显使用
      enum: [brand_new, like_new, lightly_used, well_used]
    ContactRequestStatus:
      type: string
      description: |
        联系方式申请状态。由卖家在小程序中处理，后台只读
        - pending：待处理
        - approved：已同意
        - rejected：已拒绝（只拒绝这一次，对方可以再申请）
        - blocked：已拒绝此人（对方不能再申请这条帖子）
      enum: [pending, approved, rejected, blocked]
    ListingListItem:
      type: object
      description: 闲置列表（封面墙）中的一条帖子。帖子由用户在小程序中发布，后台不能修改内容
      required:
        - id
        - seller
        - cityId
        - cityNameZh
        - categoryId
        - categoryNameZh
        - title
        - priceCents
        - negotiable
        - condition
        - status
        - removeReason
        - cover
        - imageCount
        - seen
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        seller:
          $ref: '#/components/schemas/UserBrief'
        cityId:
          $ref: '#/components/schemas/Id'
        cityNameZh:
          type: string
        categoryId:
          $ref: '#/components/schemas/Id'
        categoryNameZh:
          type: string
        title:
          type: string
          maxLength: 40
        priceCents:
          $ref: '#/components/schemas/Cents'
        negotiable:
          type: boolean
          description: 可小议
        condition:
          $ref: '#/components/schemas/ListingCondition'
        status:
          $ref: '#/components/schemas/ListingStatus'
        removeReason:
          type: [string, 'null']
          maxLength: 200
          description: 强制下架的原因。不是 admin_removed 时为 null
        cover:
          $ref: '#/components/schemas/Image'
        imageCount:
          type: integer
          minimum: 1
          maximum: 9
          description: 图片总数
        seen:
          type: boolean
          description: 是否已浏览：当且仅当已浏览的版本等于当前内容版本。全店一份，不按管理员分别记录
        createdAt:
          $ref: '#/components/schemas/DateTime'
    ListingDetail:
      description: 帖子详情。在列表字段的基础上，增加正文、全部图片、评论和联系方式申请
      allOf:
        - $ref: '#/components/schemas/ListingListItem'
        - type: object
          required: [description, images, contentChangedSinceSeen, comments, contactRequests]
          properties:
            description:
              type: string
              maxLength: 300
            images:
              type: array
              minItems: 1
              maxItems: 9
              description: 全部图片，第一张是封面
              items:
                $ref: '#/components/schemas/Image'
            contentChangedSinceSeen:
              type: boolean
              description: 曾被浏览过、但卖家之后修改了内容（本次打开之前的状态）
            comments:
              type: array
              description: 按时间正序
              items:
                $ref: '#/components/schemas/Comment'
            contactRequests:
              type: array
              description: 按时间正序
              items:
                $ref: '#/components/schemas/ContactRequest'
    Comment:
      type: object
      description: 帖子下的评论。回复只有一层
      required: [id, user, parentId, content, deleted, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        user:
          $ref: '#/components/schemas/UserBrief'
        parentId:
          description: 回复的评论。直接评论帖子时为 null
          anyOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        content:
          type: string
          maxLength: 200
          description: deleted 为 true 时为空字符串
        deleted:
          type: boolean
          description: 已被作者删除。页面显示「该评论已删除」
        createdAt:
          $ref: '#/components/schemas/DateTime'
    ContactRequest:
      type: object
      description: |
        联系方式申请（后台视角）。只展示卖家已经做出的处理结果，后台不能替卖家同意或拒绝。
        不包含卖家的手机号和微信号。
      required: [id, buyer, note, status, attemptNo, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        buyer:
          $ref: '#/components/schemas/UserBrief'
        note:
          type: [string, 'null']
          maxLength: 100
          description: 附言
        status:
          $ref: '#/components/schemas/ContactRequestStatus'
        attemptNo:
          type: integer
          minimum: 1
          description: 同一人对这条帖子的第几次申请
        createdAt:
          $ref: '#/components/schemas/DateTime'
    RemoveListingRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 200
          description: 强制下架的原因，卖家能看到。去掉首尾空格后不能为空

    # ===== C 区块结束 =====
