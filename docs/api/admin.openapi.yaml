        deliveringOrderCount:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        openRefundCount:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: 仅统计 status=open 的退款单，不统计订单 refunding 数，也不把 approved+pending 计作待审。
        openReportCount:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: 仅统计 status=open 的举报。
        cities:
          type: array
          items:
            $ref: "#/components/schemas/CityOverview"
        localFeeCents:
          $ref: "#/components/schemas/Cents"
          description: 全店默认线下配送费；配送大区可覆盖。此值不是每张订单的最终运费，也不用于快递邮费；已有订单继续读取 shippingFeeCents 快照。
