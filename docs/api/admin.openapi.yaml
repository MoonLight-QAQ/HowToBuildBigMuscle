      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Id"
        title:
          type: string
          maxLength: 40
        status:
          $ref: "#/components/schemas/ReportListingStatus"
        cover:
          $ref: "#/components/schemas/Image"
        removeReason:
          anyOf:
            - type: string
              maxLength: 200
            - type: "null"
          description: 已有下架原因的只读投影；帖子已非在售时不得覆盖。
      required:
        - id
        - title
        - status
        - cover
        - removeReason
      description: 举报模块自己的只读帖子摘要，避免占用 C 区块的 Listing/ListingBrief 定义。
    Report:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Id"
        listing:
          $ref: "#/components/schemas/ReportListingBrief"
        comment:
          anyOf:
            - $ref: "#/components/schemas/ReportCommentBrief"
            - type: "null"
        reason:
          $ref: "#/components/schemas/ReportReason"
        extra:
          anyOf:
            - type: string
              maxLength: 200
            - type: "null"
        reporter:
          $ref: "#/components/schemas/UserBrief"
        status:
          $ref: "#/components/schemas/ReportStatus"
        handledBy:
          anyOf:
            - type: string
              maxLength: 60
            - type: "null"
        handledAt:
          anyOf:
            - $ref: "#/components/schemas/DateTime"
            - type: "null"
        createdAt:
          $ref: "#/components/schemas/DateTime"
        version:
          $ref: "#/components/schemas/Version"
      required:
        - id
        - listing
        - comment
        - reason
        - extra
        - reporter
        - status
        - handledBy
        - handledAt
        - createdAt
        - version
      description: 举报整条帖子时 comment=null。处理人、时间由服务端身份与时钟决定，不接收前端伪造。
      examples:
        - id: "9000000000000000030"
          listing: &a3
            id: "9000000000000000031"
            title: 演示帖子
            status: on_sale
            cover:
              key: dev/report/demo/v1/cover.jpg
              url: https://example.invalid/mock/cover.jpg
              width: 600
              height: 800
            removeReason: null
          comment: null
          reason: fake_info
          extra: null
          reporter: *a1
          status: open
          handledBy: null
          handledAt: null
          createdAt: 2026-11-01T00:05:00Z
          version: 0
        - id: "9000000000000000030"
          listing: *a3
          comment:
            id: "9000000000000000032"
            content: ""
            deleted: true
          reason: fake_info
          extra: null
          reporter: *a1
          status: open
          handledBy: null
          handledAt: null
          createdAt: 2026-11-01T00:05:00Z
          version: 0
    CityOverview:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Id"
        nameZh:
          type: string
          maxLength: 40
        fulfillment:
          $ref: "#/components/schemas/Fulfillment"
        deliverableDistrictNamesZh:
          type: array
          items:
            type: string
            maxLength: 40
      required:
        - id
        - nameZh
        - fulfillment
        - deliverableDistrictNamesZh
    Summary:
      type: object
      additionalProperties: false
      properties:
        pendingOrderCount:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        deliveringOrderCount:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        openRefundCount:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: 仅统计 status=open 的退款单，不统计订单 refunding 数，也不把 approved+pending 计作待审。
        openReportCount:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: 仅统计 status=open 的举报。
        cities:
          type: array
          items:
            $ref: "#/components/schemas/CityOverview"
        localFeeCents:
          $ref: "#/components/schemas/Cents"
        postFeeCents:
          $ref: "#/components/schemas/Cents"
        freeShippingThresholdCents:
          $ref: "#/components/schemas/Cents"
      required:
        - pendingOrderCount
        - deliveringOrderCount
        - openRefundCount
        - openReportCount
        - cities
        - localFeeCents
        - postFeeCents
        - freeShippingThresholdCents
      description: 服务端实时计算四项待办计数；配送配置和城市只读展示，不包含商城配置写接口。
    RefundReason:
      type: string
      enum:
        - changed_mind
        - wrong_address
        - delivery_issue
        - other
      description: 退款原因，沿用字段字典。
    ReportReason:
      type: string
      enum:
        - fake_info
        - harassment
        - prohibited
        - other
      description: 举报原因，沿用字段字典。
    ReportCommentBrief:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Id"
        content:
          type: string
          maxLength: 200
          description: 评论被删除时必须返回空字符串，不泄露原正文。
        deleted:
          type: boolean
      required:
        - id
        - content
        - deleted
      description: 被举报评论的只读摘要；即使举报某一楼，第一版也处理整条帖子。
      if:
        required:
          - deleted
        properties:
          deleted:
            const: true
      then:
        properties:
          content:
            const: ""
    OrderPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/OrderListItem"
    RefundPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Refund"
    ReportPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Report"
    StartOrderDeliveryInput:
      type: object
      description: 提交读取到的版本与旧状态；操作者和时间取服务端上下文。
      additionalProperties: false
      required:
        - version
        - expectedStatus
      properties:
        version: &a4
          $ref: "#/components/schemas/Version"
        expectedStatus:
          type: string
          enum:
            - pending
    ArriveOrderInput:
      type: object
      description: 允许待配送直接送达；不接收完成时间或完成人。
      additionalProperties: false
      required:
        - version
        - expectedStatus
      properties:
        version: *a4
        expectedStatus:
          type: string
          enum:
            - pending
            - delivering
    ReviewRefundInput:
      type: object
      description: 只审核待审退款；不接收金额、数量或审核人。
      additionalProperties: false
      required:
        - version
        - expectedStatus
      properties:
        version: *a4
        expectedStatus:
          type: string
          enum:
            - open
    IgnoreReportInput:
      type: object
      description: 只忽略待处理举报，不改变帖子和已有原因。
      additionalProperties: false
      required:
        - version
        - expectedStatus
      properties:
        version: *a4
        expectedStatus:
          type: string
          enum:
            - open
    TakeDownReportInput:
      description: 按读取到的帖子状态分支。在售时原因必填；已非在售仅关闭举报，不提交新原因。服务端检查举报版本及帖子旧状态，任一过期均拒绝，不能以客户端状态绕过检查。
      oneOf:
        - type: object
          description: 下架在售帖子并处理举报。
          additionalProperties: false
          required:
            - version
            - expectedStatus
            - expectedListingStatus
            - reason
          properties:
            version: *a4
            expectedStatus: &a5
              type: string
              enum:
                - open
            expectedListingStatus:
              type: string
              enum:
                - on_sale
            reason:
              type: string
              minLength: 1
              maxLength: 200
              pattern: \S
              description: 1–200字符，不能全为空白；下架后展示给卖家。
        - type: object
          description: 帖子已非在售，只处理举报并保留原下架原因。
          additionalProperties: false
          required:
            - version
            - expectedStatus
            - expectedListingStatus
          properties:
            version: *a4
            expectedStatus: *a5
            expectedListingStatus:
              type: string
              enum:
                - sold
                - self_removed
                - admin_removed

