name: Admin web checks

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'frontend/web/**'
      - 'docs/api/admin.openapi.yaml'
      - '.github/workflows/admin-web.yml'
  push:
    branches: [develop, main]
    paths:
      - 'frontend/web/**'
      - 'docs/api/admin.openapi.yaml'
      - '.github/workflows/admin-web.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '11.25.0'
          package_json_file: frontend/web/package.json
          run_install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Regenerate API types and check drift
        run: |
          pnpm gen:api
          git diff --exit-code -- src/api/generated
          if [ -n "$(git ls-files --others --exclude-standard -- src/api/generated)" ]; then
            echo 'API generation created untracked output. Generate and commit the contract types.'
            exit 1
          fi
      - name: Lint and format
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and component tests
        run: pnpm test
      - name: Build
        run: pnpm build
